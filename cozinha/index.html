<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cozinha — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#ff8a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Escolha uma receita, junte os ingredientes pela vila (pescar, colher, puxar da horta, pegar ovos, tirar leite, comprar no mercadinho ou pedir para a vizinha) e cozinhe passo a passo. / Pick a recipe, gather the ingredients around the village (fish, pick fruit, pull veggies, collect eggs, get milk, buy at the shop or borrow from the neighbour) and cook step by step.">
<link rel="stylesheet" href="estilo.css">
<!--
  Cozinha — brincadeira da família Bolinho de Chuva (SolverONE). Ideia da filha do dono.
  Escolher uma receita, juntar os ingredientes na vila e cozinhar na cozinha de casa, em 3 níveis.
  Sem login, sem banco, sem cookie: progresso e preferências ficam só no aparelho (localStorage).
  Nada de script inline: a CSP acima não permite. Mapa dos arquivos: LEIA-ME.md.
  Versão: APP_VERSION em app.js, VERSAO em sw.js e a primeira entrada de versoes.json.
-->
</head>
<body>

<section id="entrada" class="tela ativa" data-recurso="cozinha">
  <div class="enfeite" aria-hidden="true">🥕 🍓 🥚 🧀 🍌 🍅 🐟 🥛</div>
  <div id="iconeEntrada" class="icone-entrada" aria-hidden="true"></div>
  <h1 class="logo" aria-label="Cozinha"><span>C</span><span>o</span><span>z</span><span>i</span><span>n</span><span>h</span><span>a</span></h1>
  <p class="sub" data-t="junte os ingredientes pela vila e cozinhe uma receita gostosa|gather the ingredients around the village and cook a yummy recipe"></p>
  <button id="btEntrar" class="grande" type="button" data-t="👩‍🍳 Toque para começar!|👩‍🍳 Tap to start!"></button>
  <p class="dica" data-t="Aumente o volume para ouvir a música 🎵|Turn the volume up for the music 🎵"></p>
</section>

<section id="menu" class="tela" data-recurso="cozinha">
  <div class="faixa">
    <button id="btLingua" class="mini" type="button" aria-label="Idioma / Language">EN</button>
    <button id="btVoz" class="mini" type="button" aria-label="Ler em voz alta / Read aloud">🗣️</button>
    <button id="btEfeitos" class="mini" type="button" aria-label="Sons / Sounds">🔔</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como brincar / How to play" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo pequeno" aria-label="Cozinha"><span>C</span><span>o</span><span>z</span><span>i</span><span>n</span><span>h</span><span>a</span></h1>
  <div id="ajuda" class="ajuda" hidden>
    <p data-t="1️⃣ Escolha o nível e uma receita. A ficha mostra os ingredientes e quanto precisa de cada um.|1️⃣ Pick a level and a recipe. The card shows the ingredients and how much of each you need."></p>
    <p data-t="2️⃣ Na vila, visite os lugares: pesque no rio, colha frutas maduras no pomar, puxe legumes da horta, pegue ovos no galinheiro, tire leite na fazendinha, compre no mercadinho ou peça para a vizinha (e diga obrigado!).|2️⃣ In the village, visit the places: fish at the river, pick ripe fruit in the orchard, pull veggies in the garden, collect eggs in the hen house, get milk at the farm, buy at the shop or ask the neighbour (and say thank you!)."></p>
    <p data-t="3️⃣ A cesta embaixo mostra o que já tem e o que falta. Com tudo na cesta, vá para 🏠 Casa.|3️⃣ The basket at the bottom shows what you have and what is missing. With everything in the basket, go 🏠 Home."></p>
    <p data-t="4️⃣ Na cozinha, escolha o utensílio certo e faça cada passo: esfregar e mexer em círculos, deslizar o dedo para cortar, segurar para bater, esperar o forno.|4️⃣ In the kitchen, pick the right tool and do each step: scrub and stir in circles, swipe to cut, hold to blend, wait for the oven."></p>
    <p data-t="🧑‍🍳 Na cozinha de verdade, fogão, forno, faca e liquidificador só com um adulto junto.|🧑‍🍳 In a real kitchen, stove, oven, knife and blender only with a grown-up."></p>
  </div>
  <h2 class="titulo" data-t="Escolha o nível|Pick a level"></h2>
  <div id="niveis" class="niveis" role="radiogroup"></div>
  <h2 class="titulo" data-t="Escolha a receita|Pick a recipe"></h2>
  <div id="receitas" class="receitas"></div>
  <p id="versao" class="versao"></p>
</section>

<section id="receita" class="tela" data-recurso="cozinha">
  <div class="cabeca">
    <button class="voltar mini" type="button" aria-label="Voltar / Back">←</button>
    <h2 id="recTitulo"></h2>
  </div>
  <div class="ficha-receita">
    <div id="recPrato" class="prato-grande" aria-hidden="true"></div>
    <p id="recNivel" class="selo"></p>
    <h3 data-t="🧺 Você vai precisar de:|🧺 You will need:"></h3>
    <ul id="recIngredientes" class="lista-ing"></ul>
    <p id="recBolsa" class="bolsa"></p>
    <p id="recPassos" class="dica"></p>
  </div>
  <button id="btBuscar" class="grande" type="button" data-t="🧺 Vamos buscar!|🧺 Let's go get them!"></button>
</section>

<section id="mapa" class="tela" data-recurso="cozinha">
  <div class="cabeca">
    <button class="voltar mini" type="button" aria-label="Voltar / Back">←</button>
    <h2 id="mapaTitulo"></h2>
    <div class="carteira" id="carteiraMapa"></div>
  </div>
  <div id="sol" class="sol" hidden><span id="solBola" class="sol-bola">☀️</span></div>
  <div id="vila" class="vila"></div>
  <div id="cestaMapa" class="cesta" aria-live="polite"></div>
</section>

<section id="lugar" class="tela" data-recurso="cozinha">
  <div class="cabeca">
    <button class="voltar mini" type="button" aria-label="Voltar para a vila / Back to the village">←</button>
    <h2 id="lugarTitulo"></h2>
    <div class="carteira" id="carteiraLugar"></div>
  </div>
  <p id="lugarPrecisa" class="precisa"></p>
  <div id="jogoLugar" class="jogo-lugar"></div>
  <div id="cestaLugar" class="cesta" aria-live="polite"></div>
</section>

<section id="cozinha" class="tela" data-recurso="cozinha">
  <div class="cabeca">
    <button class="voltar mini" type="button" aria-label="Voltar para a vila / Back to the village">←</button>
    <h2 id="czTitulo"></h2>
    <button id="btLer" class="mini" type="button" aria-label="Ler o passo / Read the step">🔊</button>
  </div>
  <div class="cz-corpo">
    <ol id="ficha" class="ficha" aria-label="Passos / Steps"></ol>
    <div class="bancada">
      <p id="passoNum" class="passo-num"></p>
      <p id="passoTexto" class="passo-texto" aria-live="polite"></p>
      <p id="dicaAdulto" class="dica-adulto" hidden></p>
      <div id="palco" class="palco"></div>
      <div id="utensilios" class="utensilios" aria-label="Utensílios / Kitchen tools"></div>
    </div>
  </div>
</section>

<section id="pronto" class="tela" data-recurso="cozinha">
  <div class="festa" aria-hidden="true"></div>
  <div id="prontoPrato" class="prato-final" aria-hidden="true"></div>
  <h2 id="prontoTitulo" class="titulo-pronto"></h2>
  <p id="prontoEstrelas" class="estrelas"></p>
  <p id="prontoNota" class="dica"></p>
  <article id="cartao" class="cartao-receita"></article>
  <div class="linha-botoes">
    <button id="btDeNovo" class="medio" type="button" data-t="🔁 Fazer de novo|🔁 Cook it again"></button>
    <button id="btOutra" class="medio verde" type="button" data-t="📖 Outra receita|📖 Another recipe"></button>
  </div>
</section>

<section id="desligado" class="tela" hidden>
  <p class="grande-texto" data-t="Esta brincadeira está desligada agora. Volte mais tarde! 💛|This game is turned off right now. Come back later! 💛"></p>
</section>

<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

<script src="dados.js"></script>
<script src="logica.js"></script>
<script src="desenhos.js"></script>
<script src="../recursos.js" data-app="kids" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../trilha.js" data-fora-do-arquivo></script>
<script src="app.js"></script>
</body>
</html>
