<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Labirinto — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#1b1446">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Labirintos novos a cada partida: quadrados, redondos e de colmeia, em três níveis. Leve o cachorrinho ou risque o caminho com o dedo, pegue o osso no meio e ache a saída. / A new maze every game: square, round and honeycomb, in three levels. Walk the puppy or draw the path, grab the bone in the middle and find the exit. / Laberintos nuevos en cada partida: cuadrados, redondos y de panal, en tres niveles. Lleva al perrito o traza el camino con el dedo, coge el hueso del medio y encuentra la salida.">
<link rel="stylesheet" href="estilo.css">
<!--
  Labirinto — brincadeira da família Bolinho de Chuva (SolverONE · kids).
  Gerador com semente (gerador.js), regras e colisão (regras.js), desenho em canvas (desenho.js), efeitos (som.js),
  telas e controles (app.js). Música: a trilha comum (../trilha.js). Sem login, sem banco: tudo fica no aparelho.
  Nada de script inline: a CSP acima não permite. Mapa: LEIA-ME.md. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>

<section id="menu" class="tela ativa" data-recurso="labirinto">
  <div class="faixa">
    <span class="espaco"></span>
    <button id="btEfeitos" class="mini" type="button" aria-label="Sons" data-rotulo="Sons|Sounds|Sonidos">🔊</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como brincar" data-rotulo="Como brincar|How to play|Cómo jugar" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo" aria-label="Labirinto"><span>L</span><span>a</span><span>b</span><span>i</span><span>r</span><span>i</span><span>n</span><span>t</span><span>o</span></h1>
  <canvas id="mascote" class="mascote" width="160" height="120" aria-hidden="true"></canvas>
  <div id="ajuda" class="ajuda" hidden>
    <p data-t="🧩 Escolha o formato e o nível. Cada partida é um labirinto novo, feito na hora.|🧩 Pick a shape and a level. Every game is a brand-new maze, made on the spot.|🧩 Elige la forma y el nivel. Cada partida es un laberinto nuevo, hecho en el momento."></p>
    <p data-t="🐶 Cachorrinho: toque onde o cachorrinho consegue ver, em linha reta, e ele vai andando até lá. Para virar, toque de novo depois da curva (ou arraste o dedo pelo caminho). Se ele fizer “hmm?”, toque numa casa que brilha. No computador, use as setas.|🐶 Puppy: tap where the puppy can see in a straight line and it walks there. To turn, tap again past the corner (or drag your finger along the path). If it goes “hmm?”, tap a glowing square. On a computer, use the arrow keys.|🐶 Perrito: toca donde el perrito pueda ver en línea recta y él irá andando hasta allí. Para girar, vuelve a tocar después de la curva (o desliza el dedo por el camino). Si hace “¿mmm?”, toca una casilla que brille. En el ordenador, usa las flechas."></p>
    <p data-t="✏️ Desenhar: risque o caminho com o dedo saindo da ponta da linha. Se bater na parede, a linha para: volte o dedo até a ponta e continue. ↩ desfaz e 🗑️ apaga.|✏️ Draw: draw the path with your finger starting from the tip of the line. If you hit a wall the line stops: bring your finger back to the tip and go on. ↩ undoes and 🗑️ erases.|✏️ Dibujar: traza el camino con el dedo empezando desde la punta de la línea. Si chocas con la pared, la línea se detiene: vuelve con el dedo a la punta y sigue. ↩ deshace y 🗑️ borra."></p>
    <p data-t="🦴 Missão: em muitos labirintos a saída está trancada. Pegue primeiro o osso, a chave, a estrela ou o tesouro no meio e a porta se abre!|🦴 Mission: in many mazes the exit is locked. First grab the bone, key, star or treasure in the middle and the door opens!|🦴 Misión: en muchos laberintos la salida está cerrada con llave. Primero coge el hueso, la llave, la estrella o el tesoro del medio, ¡y la puerta se abre!"></p>
    <p data-t="🔍 Labirinto grande: dois dedos aproximam e arrastam (ou os botões 🔍). A câmera segue o cachorrinho.|🔍 Big maze: two fingers zoom and pan (or the 🔍 buttons). The camera follows the puppy.|🔍 Laberinto grande: con dos dedos acercas y mueves la vista (o con los botones 🔍). La cámara sigue al perrito."></p>
  </div>

  <h2 class="titulo-escolha" data-t="Formato|Shape|Forma"></h2>
  <div class="escolha" id="formas" role="radiogroup" aria-label="Formato" data-rotulo="Formato|Shape|Forma">
    <button class="cartao-forma" type="button" role="radio" data-forma="quadrado" aria-checked="true">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="3" fill="#f4e6bd"/><path d="M3 3h34v34H3zM11 3v18M19 11v26M27 3v10M27 21h10M11 29h8M3 21h8M19 21h8" fill="none" stroke="#2e8a47" stroke-width="3" stroke-linecap="round"/></svg>
      <span data-t="Quadrado|Square|Cuadrado"></span>
    </button>
    <button class="cartao-forma" type="button" role="radio" data-forma="redondo" aria-checked="false">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#3a2f8f"/><path d="M20 3a17 17 0 1 1-12 5M20 9a11 11 0 1 1-11 11M20 15a5 5 0 1 1-5 5M20 3v6M31 20h-6M20 31v6M9 20h6" fill="none" stroke="#ff8ae0" stroke-width="3" stroke-linecap="round"/></svg>
      <span data-t="Redondo|Round|Redondo"></span>
    </button>
    <button class="cartao-forma" type="button" role="radio" data-forma="colmeia" aria-checked="false">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2l16 9v18l-16 9-16-9V11z" fill="#ffd978"/><path d="M20 2l16 9v18l-16 9-16-9V11zM20 14l7 4v8M13 18v8l7 4M20 2v6M36 29l-7-4" fill="none" stroke="#a86200" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span data-t="Colmeia|Honeycomb|Panal"></span>
    </button>
    <button class="cartao-forma" type="button" role="radio" data-forma="surpresa" aria-checked="false">
      <span class="ico-grande" aria-hidden="true">🎲</span>
      <span data-t="Surpresa|Surprise|Sorpresa"></span>
    </button>
  </div>

  <h2 class="titulo-escolha" data-t="Nível|Level|Nivel"></h2>
  <div class="escolha" id="niveis" role="radiogroup" aria-label="Nível" data-rotulo="Nível|Level|Nivel">
    <button class="cartao-nivel verde" type="button" role="radio" data-nivel="facil" aria-checked="true"><span data-t="Fácil|Easy|Fácil"></span><small class="recorde" data-rec="facil"></small></button>
    <button class="cartao-nivel amarelo" type="button" role="radio" data-nivel="medio" aria-checked="false"><span data-t="Médio|Medium|Medio"></span><small class="recorde" data-rec="medio"></small></button>
    <button class="cartao-nivel vermelho" type="button" role="radio" data-nivel="dificil" aria-checked="false"><span data-t="Difícil|Hard|Difícil"></span><small class="recorde" data-rec="dificil"></small></button>
  </div>

  <h2 class="titulo-escolha" data-t="Jeito de brincar|How to play|Cómo jugar"></h2>
  <div class="escolha" id="modos" role="radiogroup" aria-label="Jeito de brincar" data-rotulo="Jeito de brincar|How to play|Cómo jugar">
    <button class="chip-modo" type="button" role="radio" data-modo="andar" aria-checked="true" data-t="🐶 Levar o cachorrinho|🐶 Walk the puppy|🐶 Llevar al perrito"></button>
    <button class="chip-modo" type="button" role="radio" data-modo="desenhar" aria-checked="false" data-t="✏️ Desenhar o caminho|✏️ Draw the path|✏️ Dibujar el camino"></button>
  </div>

  <button id="btJogar" class="grande" type="button" data-t="▶ Jogar!|▶ Play!|▶ ¡Jugar!"></button>
  <button id="btInstalar" class="medio" type="button" hidden data-t="📲 Instalar|📲 Install|📲 Instalar"></button>
  <p id="versao" class="versao"></p>
</section>

<section id="jogo" class="tela" data-recurso="labirinto">
  <div id="barra" class="barra">
    <button id="btDesfazer" class="mini so-desenho" type="button" aria-label="Desfazer" data-rotulo="Desfazer|Undo|Deshacer">↩</button>
    <button id="btApagar" class="mini so-desenho" type="button" aria-label="Apagar a linha" data-rotulo="Apagar a linha|Erase the line|Borrar la línea">🗑️</button>
    <span id="relogio" class="relogio" aria-label="Tempo" data-rotulo="Tempo|Time|Tiempo">0:00</span>
    <span class="espaco"></span>
    <button id="btModo" class="mini" type="button" aria-label="Trocar o jeito de brincar" data-rotulo="Trocar o jeito de brincar|Switch how to play|Cambiar la forma de jugar">✏️</button>
    <button id="btNovo" class="mini" type="button" aria-label="Outro labirinto" data-rotulo="Outro labirinto|Another maze|Otro laberinto">🔄</button>
  </div>
  <div id="palco" class="palco">
    <p id="missao" class="missao" aria-live="polite"></p>
    <div id="mundo" class="mundo">
      <canvas id="chao" aria-hidden="true"></canvas>
      <canvas id="atores" aria-label="Labirinto" data-rotulo="Labirinto|Maze|Laberinto"></canvas>
    </div>
  </div>
  <div class="zoom">
    <button id="btMais" class="mini" type="button" aria-label="Aproximar" data-rotulo="Aproximar|Zoom in|Acercar">🔍+</button>
    <button id="btMenos" class="mini" type="button" aria-label="Afastar" data-rotulo="Afastar|Zoom out|Alejar">🔍−</button>
    <button id="btTudo" class="mini" type="button" aria-label="Ver o labirinto inteiro" data-rotulo="Ver o labirinto inteiro|See the whole maze|Ver el laberinto entero">⤢</button>
  </div>
  <p id="dica" class="dica-jogo" role="status" aria-live="polite" hidden></p>
</section>

<div id="fim" class="fim" hidden role="dialog" aria-modal="true" aria-labelledby="fimTitulo">
  <div class="fim-caixa">
    <h2 id="fimTitulo" data-t="Você conseguiu!|You did it!|¡Lo has conseguido!"></h2>
    <p id="fimEstrelas" class="fim-estrelas" aria-label=""></p>
    <p id="fimTexto" class="fim-texto"></p>
    <div class="fim-botoes">
      <button id="btDeNovo" class="grande" type="button" data-t="🔄 Outro labirinto|🔄 Another maze|🔄 Otro laberinto"></button>
      <button id="btMaisDificil" class="medio" type="button" data-t="⬆ Mais difícil|⬆ Harder|⬆ Más difícil"></button>
      <button id="btFimMenu" class="medio" type="button" data-t="🏠 Menu|🏠 Menu|🏠 Menú"></button>
    </div>
  </div>
</div>

<section id="desligado" class="tela" hidden>
  <h2 data-t="O Labirinto está descansando agora.|The Maze is resting right now.|El Laberinto está descansando ahora."></h2>
</section>

<script src="gerador.js"></script>
<script src="regras.js"></script>
<script src="desenho.js"></script>
<script src="som.js"></script>
<script src="../recursos.js" data-app="kids" data-fora-do-arquivo></script>
<script src="../idioma.js" data-fora-do-arquivo></script>
<script src="../navegacao.js" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../trilha.js"></script>
<script src="app.js"></script>
</body>
</html>
