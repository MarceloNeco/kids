<meta name="description" content="Batalha naval para a família: arrume a frota e afunde os navios dos amigos, cada um no seu celular ou tablet, contra o computador ou passando o aparelho. / Family battleship: place your fleet and sink your friends' ships, each on their own phone or tablet, against the computer or passing the device.">
<link rel="stylesheet" href="estilo.css">
<!--
  Batalha Naval — brincadeira da família Bolinho de Chuva (SolverONE). Visual, sons e regras próprios.
  Modos: amigos em aparelhos diferentes (2 a 4, pela internet), jogar pertinho (2 aparelhos no mesmo Wi-Fi, sem internet,
  ligados por QR code), contra o computador e passar o aparelho (sem internet).
  Sem login, sem banco, sem cookie: a frota de cada um fica só no aparelho dele. Nada de script inline: a CSP não permite.
  Mapa dos arquivos: LEIA-ME.md. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>

<header class="topo">
  <span class="marca" aria-hidden="true">⚓ <span data-t="Batalha Naval|Sea Battle|Batalla Naval"></span></span>
  <span class="espaco"></span>
  <button id="btEfeitos" class="mini" type="button" aria-label="Sons" data-rotulo="Sons|Sounds|Sonidos">🔊</button>
  <button id="btAjuda" class="mini" type="button" aria-label="Como jogar" data-rotulo="Como jogar|How to play|Cómo jugar" aria-expanded="false">❓</button>
</header>

<main>
<section id="inicio" class="tela ativa" data-recurso="batalha-naval">
  <div class="capa" aria-hidden="true">
    <svg viewBox="0 0 200 110" class="barquinho">
      <path d="M30 70 L170 70 L150 95 L50 95 Z" fill="#ff6f59"/>
      <rect x="62" y="48" width="62" height="22" rx="6" fill="#fff3d6"/>
      <rect x="84" y="28" width="16" height="22" rx="3" fill="#ffd23f"/>
      <circle cx="76" cy="59" r="5" fill="#3ee8ff"/><circle cx="96" cy="59" r="5" fill="#3ee8ff"/><circle cx="116" cy="59" r="5" fill="#3ee8ff"/>
      <path d="M132 70 L132 40 L156 56 Z" fill="#ffd23f"/>
      <path d="M0 98 Q25 86 50 98 T100 98 T150 98 T200 98 V110 H0 Z" fill="#2a8fd0"/>
    </svg>
  </div>
  <h1 class="logo"><span data-t="Batalha Naval|Sea Battle|Batalla Naval"></span></h1>
  <p class="sub" data-t="Arrume sua frota e afunde os navios dos amigos!|Place your fleet and sink your friends' ships!|¡Coloca tu flota y hunde los barcos de tus amigos!"></p>
  <div class="botoes">
    <button id="btVoltarRede" class="grande verde" type="button" hidden></button>
    <button id="btAmigos" class="grande" type="button" data-t="👫 Jogar com amigos (cada um no seu aparelho)|👫 Play with friends (each on their own device)|👫 Jugar con amigos (cada uno en su dispositivo)"></button>
    <p id="avisoSemNet" class="aviso-net" hidden data-t="📡 Sem internet agora: jogar com amigos pela internet não dá. Jogar pertinho, Contra o computador e Passar o aparelho funcionam sem internet.|📡 No internet right now: playing with friends over the internet won't work. Play nearby, Against the computer and Pass the device work offline.|📡 Ahora no hay internet: no se puede jugar con amigos por internet. Jugar de cerca, Contra el ordenador y Pasar el dispositivo funcionan sin internet."></p>
    <button id="btPerto" class="grande verde" type="button" data-t="📶 Jogar pertinho (sem internet)|📶 Play nearby (no internet)|📶 Jugar de cerca (sin internet)"></button>
    <button id="btPC" class="grande rosa" type="button" data-t="🤖 Contra o computador|🤖 Against the computer|🤖 Contra el ordenador"></button>
    <button id="btPassa" class="grande ciano" type="button" data-t="📱 Passar o aparelho (2 no mesmo)|📱 Pass the device (2 on one)|📱 Pasar el dispositivo (2 en uno)"></button>
    <button id="btInstalar" class="medio" type="button" hidden data-t="📲 Instalar|📲 Install|📲 Instalar"></button>
  </div>
  <div id="ajuda" class="ajuda" hidden>
    <h2 data-t="Como jogar|How to play|Cómo jugar"></h2>
    <p data-t="⚓ Cada um arruma a sua frota no próprio mar, sem ninguém ver: toque num navio embaixo e depois no mar. Toque no navio do mar para girar; arraste para mudar de lugar. 🎲 arruma tudo sozinho.|⚓ Everyone places their fleet in their own sea, secretly: tap a ship below, then the sea. Tap a ship in the sea to turn it; drag it to move it. 🎲 places everything for you.|⚓ Cada uno coloca su flota en su propio mar, sin que nadie la vea: toca un barco de abajo y después el mar. Toca el barco en el mar para girarlo; arrástralo para cambiarlo de lugar. 🎲 lo coloca todo solo."></p>
    <p data-t="🎯 Na sua vez, toque num quadradinho do mar do adversário. Cada quadradinho tem nome: letra da coluna e número da linha (E4, F2…).|🎯 On your turn, tap a square in your opponent's sea. Each square has a name: column letter and row number (E4, F2…).|🎯 En tu turno, toca una casilla del mar de tu rival. Cada casilla tiene nombre: la letra de la columna y el número de la fila (E4, F2…)."></p>
    <p data-t="💦 Água: não tinha navio. 💥 Acertou: tinha um pedaço de navio. 🚢 Afundou: acertou todos os pedaços daquele navio. Ganha quem afundar a frota inteira dos outros!|💦 Water: no ship there. 💥 Hit: part of a ship. 🚢 Sunk: every part of that ship was hit. Whoever sinks everyone else's whole fleet wins!|💦 Agua: no había barco. 💥 Tocado: había un trozo de barco. 🚢 Hundido: has tocado todos los trozos de ese barco. ¡Gana quien hunda la flota entera de los demás!"></p>
    <p data-t="👫 Com amigos: um toca em Criar partida e recebe um código de 4 letras; os outros tocam em Entrar e digitam o código (ou abrem o link do convite). De 2 a 4 jogadores. Com 3 ou 4, na sua vez você escolhe em quem atirar.|👫 With friends: one taps Create game and gets a 4-letter code; the others tap Join and type the code (or open the invite link). 2 to 4 players. With 3 or 4, on your turn you pick who to fire at.|👫 Con amigos: uno pulsa Crear partida y recibe un código de 4 letras; los demás pulsan Entrar y escriben el código (o abren el enlace de la invitación). De 2 a 4 jugadores. Con 3 o 4, en tu turno eliges a quién disparar."></p>
    <p data-t="📶 Jogar pertinho (sem internet, até no avião): um celular liga o Roteador Wi-Fi e o outro conecta nele; depois um mostra um código QR e o outro lê com a câmera, e ao contrário. Dois jogadores.|📶 Play nearby (no internet, even on a plane): one phone turns on its Wi-Fi hotspot and the other joins it; then one shows a QR code and the other scans it with the camera, and the other way round. Two players.|📶 Jugar de cerca (sin internet, hasta en el avión): un móvil activa el punto de acceso Wi-Fi y el otro se conecta a él; después uno muestra un código QR y el otro lo lee con la cámara, y al revés. Dos jugadores."></p>
    <p data-t="🐟 Fácil: mar 8×8 e 4 navios. 🐬 Médio: mar 10×10 e 5 navios. 🦈 Difícil: mar 12×12 e 7 navios. Contra o computador, o nível também deixa ele mais esperto.|🐟 Easy: 8×8 sea and 4 ships. 🐬 Medium: 10×10 sea and 5 ships. 🦈 Hard: 12×12 sea and 7 ships. Against the computer, the level also makes it smarter.|🐟 Fácil: mar de 8×8 y 4 barcos. 🐬 Medio: mar de 10×10 y 5 barcos. 🦈 Difícil: mar de 12×12 y 7 barcos. Contra el ordenador, el nivel también lo hace más listo."></p>
  </div>
  <p id="versao" class="versao"></p>
</section>

<section id="nivel" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 id="nivelTitulo" data-t="Escolha o nível|Pick the level|Elige el nivel"></h2></div>
  <div class="botoes">
    <button class="grande nivel" type="button" data-nivel="facil"><b data-t="🐟 Fácil|🐟 Easy|🐟 Fácil"></b><small data-t="mar 8×8 · 4 navios|8×8 sea · 4 ships|mar de 8×8 · 4 barcos"></small><small class="so-pc" data-t="o computador atira ao acaso|the computer fires at random|el ordenador dispara al azar"></small></button>
    <button class="grande nivel rosa" type="button" data-nivel="medio"><b data-t="🐬 Médio|🐬 Medium|🐬 Medio"></b><small data-t="mar 10×10 · 5 navios|10×10 sea · 5 ships|mar de 10×10 · 5 barcos"></small><small class="so-pc" data-t="o computador caça seus navios|the computer hunts your ships|el ordenador busca tus barcos"></small></button>
    <button class="grande nivel ciano" type="button" data-nivel="dificil"><b data-t="🦈 Difícil|🦈 Hard|🦈 Difícil"></b><small data-t="mar 12×12 · 7 navios|12×12 sea · 7 ships|mar de 12×12 · 7 barcos"></small><small class="so-pc" data-t="o computador calcula onde é mais provável|the computer works out the likeliest spot|el ordenador calcula dónde es más probable"></small></button>
  </div>
</section>

<section id="amigos" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 data-t="👫 Jogar com amigos|👫 Play with friends|👫 Jugar con amigos"></h2></div>
  <div class="cartao">
    <label class="campo"><span data-t="Seu nome|Your name|Tu nombre"></span> <input id="nome" maxlength="16" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="cartao">
    <h3 data-t="Vai começar uma partida?|Starting a game?|¿Vas a empezar una partida?"></h3>
    <button id="btCriar" class="grande verde" type="button" data-t="➕ Criar partida|➕ Create game|➕ Crear partida"></button>
  </div>
  <div class="cartao">
    <h3 data-t="Alguém já criou? Digite o código:|Someone already created one? Type the code:|¿Alguien ya la ha creado? Escribe el código:"></h3>
    <form id="formEntrar" class="entrar">
      <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Código" data-rotulo="Código|Code|Código">
      <button id="btEntrar" class="grande" type="submit" data-t="Entrar|Join|Entrar"></button>
    </form>
    <p id="amigosMsg" class="dica" aria-live="polite"></p>
  </div>
  <p class="dica" data-t="📡 Jogar assim precisa de internet (Wi-Fi ou dados). Sem internet, use 📶 Jogar pertinho. A frota de cada um fica escondida no próprio aparelho.|📡 Playing this way needs internet (Wi-Fi or data). Without internet, use 📶 Play nearby. Each fleet stays hidden on its own device.|📡 Para jugar así hace falta internet (Wi-Fi o datos). Sin internet, usa 📶 Jugar de cerca. La flota de cada uno queda escondida en su propio dispositivo."></p>
</section>

<section id="sala" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><h2><span data-t="Sala|Room|Sala"></span></h2></div>
  <p id="salaPerto" class="cartao centro" hidden data-t="📶 Pertinho: os dois aparelhos estão ligados direto, sem internet.|📶 Nearby: both devices are linked directly, no internet.|📶 De cerca: los dos dispositivos están conectados directamente, sin internet."></p>
  <div id="salaConvite" class="cartao centro">
    <p class="dica" data-t="Código da partida|Game code|Código de la partida"></p>
    <div id="salaCodigo" class="codigo-grande" aria-live="polite"></div>
    <p id="salaComo" class="dica" data-t="Os outros abrem solverone.com.br/kids → ⚓ Batalha Naval → 👫 Jogar com amigos e digitam este código. Ou mande o convite:|The others open solverone.com.br/kids → ⚓ Sea Battle → 👫 Play with friends and type this code. Or send the invite:|Los demás abren solverone.com.br/kids → ⚓ Batalla Naval → 👫 Jugar con amigos y escriben este código. O manda la invitación:"></p>
    <div class="linha">
      <button id="btCompartilhar" class="medio" type="button" data-t="📤 Mandar convite|📤 Send invite|📤 Mandar invitación"></button>
      <button id="btCopiar" class="medio" type="button" data-t="🔗 Copiar link|🔗 Copy link|🔗 Copiar enlace"></button>
    </div>
    <p id="salaLink" class="link"></p>
  </div>
  <div class="cartao">
    <h3 data-t="Jogadores (até 4)|Players (up to 4)|Jugadores (hasta 4)"></h3>
    <ol id="salaLista" class="lista-jog"></ol>
    <p id="salaStatus" class="status" aria-live="polite"></p>
  </div>
  <div class="botoes">
    <button id="btArrumar" class="grande" type="button"></button>
    <button id="btComecar" class="grande verde" type="button" hidden data-t="▶️ Começar a batalha!|▶️ Start the battle!|▶️ ¡Empezar la batalla!"></button>
    <button id="btSairSala" class="medio cinza" type="button" data-t="🚪 Sair da sala|🚪 Leave the room|🚪 Salir de la sala"></button>
  </div>
</section>

<section id="perto" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 data-t="📶 Jogar pertinho (sem internet)|📶 Play nearby (no internet)|📶 Jugar de cerca (sin internet)"></h2></div>
  <div class="cartao">
    <h3 data-t="Como ligar os dois celulares|How to link the two phones|Cómo conectar los dos móviles"></h3>
    <ol class="passos">
      <li><span class="ilu" aria-hidden="true">📱📶</span><span data-t="Um celular liga o Roteador Wi-Fi (também chamado Ponto de acesso ou Hotspot), mesmo em modo avião.|One phone turns on its Wi-Fi hotspot (also called Mobile hotspot or Access point), even in airplane mode.|Un móvil activa el punto de acceso Wi-Fi (también llamado Zona Wi-Fi o Hotspot), incluso en modo avión."></span></li>
      <li><span class="ilu" aria-hidden="true">📱➡️📶</span><span data-t="O outro conecta nesse Wi-Fi (o nome aparece na lista de Wi-Fi). Se ele perguntar se quer continuar numa rede sem internet, toque em Sim.|The other one joins that Wi-Fi (its name shows in the Wi-Fi list). If it asks whether to stay on a network without internet, tap Yes.|El otro se conecta a ese Wi-Fi (el nombre aparece en la lista de Wi-Fi). Si pregunta si quieres seguir en una red sin internet, toca Sí."></span></li>
      <li><span class="ilu" aria-hidden="true">🔳➡️📷</span><span data-t="Um mostra o código, o outro lê com a câmera, e depois ao contrário.|One shows the code, the other scans it with the camera, and then the other way round.|Uno muestra el código, el otro lo lee con la cámara, y después al revés."></span></li>
    </ol>
    <p class="dica" data-t="🍎 iPhone quase nunca consegue ligar o Roteador em modo avião: deixe um Android ser o roteador; o iPhone pode conectar nele.|🍎 iPhones usually can't turn on the hotspot in airplane mode: let an Android be the hotspot; the iPhone can join it.|🍎 El iPhone casi nunca puede activar el punto de acceso en modo avión: deja que un Android comparta la conexión; el iPhone puede conectarse a él."></p>
    <p class="dica" data-t="💾 Os dois aparelhos precisam ter aberto a Batalha Naval com internet pelo menos uma vez (para ela ficar guardada). O jogo vai pedir a câmera: toque em Permitir.|💾 Both devices need to have opened Sea Battle with internet at least once (so it is saved on them). The game will ask for the camera: tap Allow.|💾 Los dos dispositivos tienen que haber abierto Batalla Naval con internet al menos una vez (para que quede guardada). El juego va a pedir la cámara: toca Permitir."></p>
  </div>
  <div class="cartao">
    <label class="campo"><span data-t="Seu nome|Your name|Tu nombre"></span> <input id="nomePerto" maxlength="16" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="botoes">
    <button id="btPertoCriar" class="grande verde" type="button" data-t="➕ Criar partida pertinho|➕ Create nearby game|➕ Crear partida de cerca"></button>
    <button id="btPertoEntrar" class="grande ciano" type="button" data-t="📷 Entrar pertinho (ler o código)|📷 Join nearby (scan the code)|📷 Entrar de cerca (leer el código)"></button>
  </div>
  <p id="pertoMsg" class="dica" aria-live="polite"></p>
</section>

<section id="pertoCodigo" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 id="pertoCodTitulo"></h2></div>
  <p id="pertoCodDica" class="dica centro"></p>
  <div class="qr-caixa"><canvas id="pertoQR" class="qr" role="img" aria-label="QR code"></canvas></div>
  <p id="pertoCodStatus" class="status centro" aria-live="polite"></p>
  <div class="botoes">
    <button id="btPertoLerResposta" class="grande ciano" type="button" hidden data-t="📷 Agora ler o código do outro celular|📷 Now scan the other phone's code|📷 Ahora leer el código del otro móvil"></button>
    <button id="btPertoDeNovo" class="medio" type="button" hidden data-t="🔄 Começar de novo|🔄 Start over|🔄 Empezar de nuevo"></button>
  </div>
  <details class="cartao texto-codigo">
    <summary data-t="Sem câmera? Ver o código em texto|No camera? See the code as text|¿Sin cámara? Ver el código en texto"></summary>
    <p id="pertoCodTexto" class="link"></p>
    <button id="btPertoCopiar" class="medio" type="button" data-t="📋 Copiar o código|📋 Copy the code|📋 Copiar el código"></button>
  </details>
  <div class="botoes"><button id="btPertoCancelar1" class="grande cinza-g" type="button" data-t="✖ Cancelar|✖ Cancel|✖ Cancelar"></button></div>
</section>

<section id="pertoLer" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 id="pertoLerTitulo"></h2></div>
  <p id="pertoLerDica" class="dica centro"></p>
  <div class="camera-caixa"><video id="pertoVideo" class="camera" playsinline muted autoplay></video><div class="mira-qr" aria-hidden="true"></div></div>
  <p id="pertoLerStatus" class="status centro" aria-live="polite"></p>
  <details id="pertoColarCaixa" class="cartao texto-codigo">
    <summary data-t="⌨️ Colar o código em texto|⌨️ Paste the code as text|⌨️ Pegar el código en texto"></summary>
    <textarea id="pertoColar" rows="3" autocomplete="off" spellcheck="false" aria-label="Código" data-rotulo="Código|Code|Código"></textarea>
    <button id="btPertoUsar" class="medio" type="button" data-t="✅ Usar este código|✅ Use this code|✅ Usar este código"></button>
  </details>
  <div class="botoes"><button id="btPertoCancelar2" class="grande cinza-g" type="button" data-t="✖ Cancelar|✖ Cancel|✖ Cancelar"></button></div>
</section>

<section id="arrumar" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">←</button><h2 id="arrTitulo"></h2></div>
  <p class="dica" data-t="Toque num navio aqui embaixo e depois no mar. Toque no navio do mar para girar; arraste para mudar de lugar.|Tap a ship below, then the sea. Tap a ship in the sea to turn it; drag it to move it.|Toca un barco de aquí abajo y después el mar. Toca el barco en el mar para girarlo; arrástralo para cambiarlo de lugar."></p>

        <button id="btLimpar" class="medio cinza" type="button" data-t="🧹 Limpar|🧹 Clear|🧹 Borrar"></button>
      </div>
      <button id="btPronto" class="grande verde" type="button" disabled data-t="✅ Pronto!|✅ Ready!|✅ ¡Listo!"></button>

</section>

<section id="jogo" class="tela" data-recurso="batalha-naval">
  <div id="banner" class="banner" role="status" aria-live="polite"></div>
  <div id="fila" class="fila" aria-label="Ordem das vezes" data-rotulo="Ordem das vezes|Turn order|Orden de los turnos"></div>

    </div>
  </div>
</section>

<section id="desligado" class="tela" hidden>
  <h2 data-t="A Batalha Naval está descansando agora.|Sea Battle is resting right now.|Batalla Naval está descansando ahora."></h2>
