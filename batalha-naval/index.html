<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Batalha Naval — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#071a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Batalha naval para a família: arrume a frota e afunde os navios dos amigos, cada um no seu celular ou tablet, contra o computador ou passando o aparelho. / Family battleship: place your fleet and sink your friends' ships, each on their own phone or tablet, against the computer or passing the device.">
<link rel="stylesheet" href="estilo.css">
<!--
  Batalha Naval — brincadeira da família Bolinho de Chuva (SolverONE). Visual, sons e regras próprios.
  Modos: amigos em aparelhos diferentes (2 a 4, pela internet), contra o computador e passar o aparelho (sem internet).
  Sem login, sem banco, sem cookie: a frota de cada um fica só no aparelho dele. Nada de script inline: a CSP não permite.
  Mapa dos arquivos: LEIA-ME.md. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>

<header class="topo">
  <a id="btCasa" class="mini" href="../" aria-label="Bolinho de Chuva — todas as brincadeiras / all games">🏠</a>
  <span class="marca" aria-hidden="true">⚓ <span data-t="Batalha Naval|Sea Battle"></span></span>
  <span class="espaco"></span>
  <button id="btLingua" class="mini" type="button" aria-label="Idioma / Language">EN</button>
  <button id="btEfeitos" class="mini" type="button" aria-label="Sons / Sounds">🔊</button>
  <button id="btAjuda" class="mini" type="button" aria-label="Como jogar / How to play" aria-expanded="false">❓</button>
</header>

<main>
<section id="inicio" class="tela ativa" data-recurso="batalha-naval">
  <div class="capa" aria-hidden="true">
    <svg viewBox="0 0 200 110" class="barquinho">
      <path d="M30 70 L170 70 L150 95 L50 95 Z" fill="#ff6f59"/>
      <rect x="62" y="48" width="62" height="22" rx="6" fill="#fff3d6"/>
      <rect x="84" y="28" width="16" height="22" rx="3" fill="#ffd23f"/>
      <circle cx="76" cy="59" r="5" fill="#3ee8ff"/><circle cx="96" cy="59" r="5" fill="#3ee8ff"/><circle cx="116" cy="59" r="5" fill="#3ee8ff"/>
      <path d="M132 70 L132 40 L156 56 Z" fill="#ffd23f"/>
      <path d="M0 98 Q25 86 50 98 T100 98 T150 98 T200 98 V110 H0 Z" fill="#2a8fd0"/>
    </svg>
  </div>
  <h1 class="logo"><span data-t="Batalha Naval|Sea Battle"></span></h1>
  <p class="sub" data-t="Arrume sua frota e afunde os navios dos amigos!|Place your fleet and sink your friends' ships!"></p>
  <div class="botoes">
    <button id="btVoltarRede" class="grande verde" type="button" hidden></button>
    <button id="btAmigos" class="grande" type="button" data-t="👫 Jogar com amigos (cada um no seu aparelho)|👫 Play with friends (each on their own device)"></button>
    <p id="avisoSemNet" class="aviso-net" hidden data-t="📡 Sem internet agora: jogar com amigos em aparelhos diferentes precisa de internet. Contra o computador e Passar o aparelho funcionam sem internet.|📡 No internet right now: playing with friends on different devices needs internet. Against the computer and Pass the device work offline."></p>
    <button id="btPC" class="grande rosa" type="button" data-t="🤖 Contra o computador|🤖 Against the computer"></button>
    <button id="btPassa" class="grande ciano" type="button" data-t="📱 Passar o aparelho (2 no mesmo)|📱 Pass the device (2 on one)"></button>
    <button id="btInstalar" class="medio" type="button" hidden data-t="📲 Instalar|📲 Install"></button>
  </div>
  <div id="ajuda" class="ajuda" hidden>
    <h2 data-t="Como jogar|How to play"></h2>
    <p data-t="⚓ Cada um arruma a sua frota no próprio mar, sem ninguém ver: toque num navio embaixo e depois no mar. Toque no navio do mar para girar; arraste para mudar de lugar. 🎲 arruma tudo sozinho.|⚓ Everyone places their fleet in their own sea, secretly: tap a ship below, then the sea. Tap a ship in the sea to turn it; drag it to move it. 🎲 places everything for you."></p>
    <p data-t="🎯 Na sua vez, toque num quadradinho do mar do adversário. Cada quadradinho tem nome: letra da coluna e número da linha (E4, F2…).|🎯 On your turn, tap a square in your opponent's sea. Each square has a name: column letter and row number (E4, F2…)."></p>
    <p data-t="💦 Água: não tinha navio. 💥 Acertou: tinha um pedaço de navio. 🚢 Afundou: acertou todos os pedaços daquele navio. Ganha quem afundar a frota inteira dos outros!|💦 Water: no ship there. 💥 Hit: part of a ship. 🚢 Sunk: every part of that ship was hit. Whoever sinks everyone else's whole fleet wins!"></p>
    <p data-t="👫 Com amigos: um toca em Criar partida e recebe um código de 4 letras; os outros tocam em Entrar e digitam o código (ou abrem o link do convite). De 2 a 4 jogadores. Com 3 ou 4, na sua vez você escolhe em quem atirar.|👫 With friends: one taps Create game and gets a 4-letter code; the others tap Join and type the code (or open the invite link). 2 to 4 players. With 3 or 4, on your turn you pick who to fire at."></p>
    <p data-t="🐟 Fácil: mar 8×8 e 4 navios. 🐬 Médio: mar 10×10 e 5 navios. 🦈 Difícil: mar 12×12 e 7 navios. Contra o computador, o nível também deixa ele mais esperto.|🐟 Easy: 8×8 sea and 4 ships. 🐬 Medium: 10×10 sea and 5 ships. 🦈 Hard: 12×12 sea and 7 ships. Against the computer, the level also makes it smarter."></p>
  </div>
  <p id="versao" class="versao"></p>
</section>

<section id="nivel" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar / Back">←</button><h2 id="nivelTitulo" data-t="Escolha o nível|Pick the level"></h2></div>
  <div class="botoes">
    <button class="grande nivel" type="button" data-nivel="facil"><b data-t="🐟 Fácil|🐟 Easy"></b><small data-t="mar 8×8 · 4 navios|8×8 sea · 4 ships"></small><small class="so-pc" data-t="o computador atira ao acaso|the computer fires at random"></small></button>
    <button class="grande nivel rosa" type="button" data-nivel="medio"><b data-t="🐬 Médio|🐬 Medium"></b><small data-t="mar 10×10 · 5 navios|10×10 sea · 5 ships"></small><small class="so-pc" data-t="o computador caça seus navios|the computer hunts your ships"></small></button>
    <button class="grande nivel ciano" type="button" data-nivel="dificil"><b data-t="🦈 Difícil|🦈 Hard"></b><small data-t="mar 12×12 · 7 navios|12×12 sea · 7 ships"></small><small class="so-pc" data-t="o computador calcula onde é mais provável|the computer works out the likeliest spot"></small></button>
  </div>
</section>

<section id="amigos" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar / Back">←</button><h2 data-t="👫 Jogar com amigos|👫 Play with friends"></h2></div>
  <div class="cartao">
    <label class="campo"><span data-t="Seu nome|Your name"></span> <input id="nome" maxlength="16" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="cartao">
    <h3 data-t="Vai começar uma partida?|Starting a game?"></h3>
    <button id="btCriar" class="grande verde" type="button" data-t="➕ Criar partida|➕ Create game"></button>
  </div>
  <div class="cartao">
    <h3 data-t="Alguém já criou? Digite o código:|Someone already created one? Type the code:"></h3>
    <form id="formEntrar" class="entrar">
      <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Código / Code">
      <button id="btEntrar" class="grande" type="submit" data-t="Entrar|Join"></button>
    </form>
    <p id="amigosMsg" class="dica" aria-live="polite"></p>
  </div>
  <p class="dica" data-t="📡 Jogar em aparelhos diferentes precisa de internet (Wi-Fi ou dados). A frota de cada um fica escondida no próprio aparelho.|📡 Playing on different devices needs internet (Wi-Fi or data). Each fleet stays hidden on its own device."></p>
</section>

<section id="sala" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><h2><span data-t="Sala|Room"></span></h2></div>
  <div class="cartao centro">
    <p class="dica" data-t="Código da partida|Game code"></p>
    <div id="salaCodigo" class="codigo-grande" aria-live="polite"></div>
    <p id="salaComo" class="dica" data-t="Os outros abrem solverone.com.br/kids → ⚓ Batalha Naval → 👫 Jogar com amigos e digitam este código. Ou mande o convite:|The others open solverone.com.br/kids → ⚓ Sea Battle → 👫 Play with friends and type this code. Or send the invite:"></p>
    <div class="linha">
      <button id="btCompartilhar" class="medio" type="button" data-t="📤 Mandar convite|📤 Send invite"></button>
      <button id="btCopiar" class="medio" type="button" data-t="🔗 Copiar link|🔗 Copy link"></button>
    </div>
    <p id="salaLink" class="link"></p>
  </div>
  <div class="cartao">
    <h3 data-t="Jogadores (até 4)|Players (up to 4)"></h3>
    <ol id="salaLista" class="lista-jog"></ol>
    <p id="salaStatus" class="status" aria-live="polite"></p>
  </div>
  <div class="botoes">
    <button id="btArrumar" class="grande" type="button"></button>
    <button id="btComecar" class="grande verde" type="button" hidden data-t="▶️ Começar a batalha!|▶️ Start the battle!"></button>
    <button id="btSairSala" class="medio cinza" type="button" data-t="🚪 Sair da sala|🚪 Leave the room"></button>
  </div>
</section>

<section id="arrumar" class="tela" data-recurso="batalha-naval">
  <div class="cabeca"><button class="voltar mini" type="button" aria-label="Voltar / Back">←</button><h2 id="arrTitulo"></h2></div>
  <p class="dica" data-t="Toque num navio aqui embaixo e depois no mar. Toque no navio do mar para girar; arraste para mudar de lugar.|Tap a ship below, then the sea. Tap a ship in the sea to turn it; drag it to move it."></p>
  <div class="arrumar-corpo">
    <div id="arrTab" class="tab arr" aria-label="Seu mar / Your sea"></div>
    <div class="arrumar-lado">
      <div id="arrPecas" class="pecas"></div>
      <div class="linha">
        <button id="btGirar" class="medio" type="button"></button>
        <button id="btSortear" class="medio" type="button" data-t="🎲 Arrumar sozinho|🎲 Place for me"></button>
        <button id="btLimpar" class="medio cinza" type="button" data-t="🧹 Limpar|🧹 Clear"></button>
      </div>
      <button id="btPronto" class="grande verde" type="button" disabled data-t="✅ Pronto!|✅ Ready!"></button>
    </div>
  </div>
</section>

<section id="jogo" class="tela" data-recurso="batalha-naval">
  <div id="banner" class="banner" role="status" aria-live="polite"></div>
  <div id="fila" class="fila" aria-label="Ordem das vezes / Turn order"></div>
  <div id="semEle" class="linha" hidden></div>
  <div id="alvos" class="alvos" hidden role="tablist" aria-label="Em quem atirar / Who to fire at"></div>
  <div class="mares">
    <div class="mar-alvo">
      <h3 id="tituloAlvo" class="titulo-mar"></h3>
      <div id="tabAlvo" class="tab alvo"></div>
    </div>
    <div class="mar-meu">
      <h3 id="tituloMeu" class="titulo-mar"></h3>
      <div id="tabMeu" class="tab meu" aria-hidden="true"></div>
      <p id="ultimo" class="ultimo" aria-live="polite"></p>
      <div id="frotaInfo" class="frota-info"></div>
    </div>
  </div>
  <div id="fimCaixa" class="fim-caixa" hidden>
    <h2 id="fimTitulo"></h2>
    <p id="fimTexto"></p>
    <div class="linha">
      <button id="btDeNovo" class="grande verde" type="button" data-t="🔁 Jogar de novo|🔁 Play again"></button>
      <button id="btInicioFim" class="medio" type="button" data-t="🏠 Início|🏠 Home"></button>
    </div>
  </div>
  <div class="linha rodape-jogo"><button id="btSairJogo" class="mini-texto" type="button" data-t="🚪 Sair da partida|🚪 Leave game"></button></div>
</section>

<section id="desligado" class="tela" hidden>
  <h2 data-t="A Batalha Naval está descansando agora.|Sea Battle is resting right now."></h2>
</section>
</main>

<div id="cortina" class="cortina" hidden role="dialog" aria-modal="true" aria-labelledby="cortinaTitulo">
  <div class="cortina-caixa">
    <div class="cortina-ico" aria-hidden="true">🙈</div>
    <h2 id="cortinaTitulo"></h2>
    <p id="cortinaTexto"></p>
    <button id="btCortina" class="grande verde" type="button" data-t="👀 Estou pronto|👀 I'm ready"></button>
  </div>
</div>

<div id="estouro" class="estouro" hidden aria-hidden="true"></div>
<div id="confete" class="confete" aria-hidden="true"></div>
<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

<div id="janela" class="janela" hidden role="dialog" aria-modal="true" aria-labelledby="janelaTitulo">
  <div class="janela-caixa">
    <h2 id="janelaTitulo"></h2>
    <p id="janelaTexto"></p>
    <div id="janelaBotoes" class="linha"></div>
  </div>
</div>

<script src="../recursos.js" data-app="kids" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../trilha.js" data-fora-do-arquivo></script>
<script src="logica.js"></script>
<script src="rede.js"></script>
<script src="som.js"></script>
<script src="app.js"></script>
</body>
</html>
