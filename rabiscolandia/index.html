<!--
  Rabiscolândia — sexta brincadeira da família Bolinho de Chuva (SolverONE · Feature Tester).
  Desenhar livre, livro de colorir (contorno), pintar por números, adesivos animados, fundos, música,
  mão na câmera (MediaPipe, no aparelho) e TV com o celular de controle.
  Sem login, sem banco, sem cookie: tudo fica no aparelho. Nada de script inline: a CSP acima não permite.
  Mapa dos arquivos: LEIA-ME.md. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->

<body>

<section id="entrada" class="tela ativa" data-recurso="rabiscolandia">
  <div class="rabiscos" aria-hidden="true"></div>
  <h1 class="logo" aria-label="Rabiscolândia"><span>R</span><span>a</span><span>b</span><span>i</span><span>s</span><span>c</span><span>o</span><span>l</span><span>â</span><span>n</span><span>d</span><span>i</span><span>a</span></h1>
  <p class="sub" data-t="desenhar, colorir e pintar por números — com a mão, no celular, no tablet e na TV|draw, color and paint by numbers — with your hand, on phone, tablet and TV|dibujar, colorear y pintar por números — con la mano, en el móvil, la tablet y la tele"></p>
  <button id="btEntrar" class="grande" type="button" data-t="🎨 Toque para começar!|🎨 Tap to start!|🎨 ¡Toca para empezar!"></button>
  <p class="dica" data-t="Aumente o volume para ouvir a música 🎵|Turn the volume up for the music 🎵|Sube el volumen para oír la música 🎵"></p>
</section>

<section id="menu" class="tela" data-recurso="rabiscolandia">
  <div class="faixa">
    <button id="btMusica" class="mini" type="button" aria-label="Música" data-rotulo="Música|Music|Música">🎵</button>
    <button id="btEfeitos" class="mini" type="button" aria-label="Sons" data-rotulo="Sons|Sounds|Sonidos">🔊</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como brincar" data-rotulo="Como brincar|How to play|Cómo jugar" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo pequeno" aria-label="Rabiscolândia"><span>R</span><span>a</span><span>b</span><span>i</span><span>s</span><span>c</span><span>o</span><span>l</span><span>â</span><span>n</span><span>d</span><span>i</span><span>a</span></h1>
  <div id="ajuda" class="ajuda" hidden>
    <p data-t="🎨 Desenhar livre: escolha o pincel, a cor e o tamanho embaixo e desenhe com o dedo. Os pincéis ✨ vivos mexem sozinhos: arco-íris que corre, neon que pisca, purpurina que brilha e minhoca que dança.|🎨 Free drawing: pick a brush, a color and a size at the bottom and draw with your finger. The ✨ live brushes move by themselves: running rainbow, glowing neon, sparkling glitter and a dancing worm.|🎨 Dibujo libre: elige abajo el pincel, el color y el tamaño, y dibuja con el dedo. Los pinceles ✨ vivos se mueven solos: arcoíris que corre, neón que parpadea, purpurina que brilla y un gusano que baila."></p>
    <p data-t="📚 Livro de colorir: escolha um desenho e pinte com qualquer pincel ou com o balde 🪣, que enche a área sem passar do contorno. 👀 mostra a colinha (como pode ficar) e 🎨 troca as cores da colinha.|📚 Coloring book: pick a picture and paint with any brush or the bucket 🪣, which fills the area without crossing the outline. 👀 shows the cheat sheet and 🎨 changes its colors.|📚 Libro para colorear: elige un dibujo y píntalo con cualquier pincel o con el cubo 🪣, que llena la parte sin salirse del borde. 👀 muestra el modelo (cómo puede quedar) y 🎨 cambia sus colores."></p>
    <p data-t="🔢 Pintar por números: escolha uma cor numerada embaixo e toque nas áreas com o mesmo número. Use dois dedos para chegar perto. 🪄 mostra onde falta.|🔢 Paint by numbers: pick a numbered color at the bottom and tap the areas with the same number. Use two fingers to zoom. 🪄 shows what is missing.|🔢 Pintar por números: elige abajo un color con número y toca las partes con el mismo número. Usa dos dedos para acercarte. 🪄 muestra lo que falta."></p>
    <p data-t="🖐 Com a mão: fique na frente da câmera. Mão aberta ✋ mira, mão fechada ✊ desenha. Mão aberta parada em cima de um botão aperta o botão.|🖐 With your hand: stand in front of the camera. Open hand ✋ aims, closed hand ✊ draws. Holding an open hand over a button presses it.|🖐 Con la mano: ponte delante de la cámara. Mano abierta ✋ apunta, mano cerrada ✊ dibuja. Si dejas la mano abierta quieta sobre un botón, lo aprietas."></p>
    <p data-t="⭐ Adesivos: escolha um e toque na folha para colar. Os animados mexem! ✋ arrasta um adesivo. 🏞️ troca o fundo: paisagens, cores ou uma foto sua.|⭐ Stickers: pick one and tap the page to stick it. The animated ones move! ✋ drags a sticker. 🏞️ changes the background: landscapes, colors or your own photo.|⭐ Pegatinas: elige una y toca la hoja para pegarla. ¡Las animadas se mueven! ✋ arrastra una pegatina. 🏞️ cambia el fondo: paisajes, colores o una foto tuya."></p>
    <p data-t="📱 Gire o aparelho à vontade: o menu fica no mesmo lugar e o desenho se ajusta para caber na tela inteira. Dois dedos fazem zoom.|📱 Turn the device any way: the menu stays in place and the drawing adjusts to fill the whole screen. Two fingers zoom.|📱 Gira el dispositivo como quieras: el menú se queda en su sitio y el dibujo se ajusta a toda la pantalla. Dos dedos hacen zoom."></p>
  </div>
  <div class="botoes-menu">
    <button id="btLivre" class="grande" type="button" data-t="🎨 Desenhar livre|🎨 Free drawing|🎨 Dibujo libre"></button>
    <button id="btLivro" class="grande rosa" type="button" data-t="📚 Livro de colorir|📚 Coloring book|📚 Libro para colorear"></button>
    <button id="btNumeros" class="grande ciano" type="button" data-t="🔢 Pintar por números|🔢 Paint by numbers|🔢 Pintar por números"></button>
    <div class="linha-menu">
      <button id="btComMao" class="medio" type="button" data-t="🖐 Desenhar com a mão|🖐 Draw with your hand|🖐 Dibujar con la mano"></button>
      <button id="btAprender" class="medio" type="button" data-t="🎓 Aprender a brincar|🎓 Learn to play|🎓 Aprender a jugar"></button>
      <button id="btMeus" class="medio" type="button"><span data-t="🖼️ Meus desenhos|🖼️ My drawings|🖼️ Mis dibujos"></span> <span id="qtdMeus" class="bolha">0</span></button>
    </div>
    <div class="linha-menu">
      <button id="btTV" class="medio" type="button" data-so-site data-t="📺 Na TV|📺 On the TV|📺 En la tele"></button>
      <button id="btInstalar" class="medio" type="button" hidden data-t="📲 Instalar|📲 Install|📲 Instalar"></button>
    </div>
  </div>

</section>

<section id="meus" class="tela" data-recurso="rabiscolandia">
  <div class="cabeca">
    <h2 data-t="🖼️ Meus desenhos|🖼️ My drawings|🖼️ Mis dibujos"></h2>
  </div>
  <p id="meusVazio" class="dica" hidden data-t="Ainda não tem nenhum desenho guardado. Eles ficam aqui sozinhos enquanto você desenha.|No drawings yet. They are kept here automatically while you draw.|Todavía no hay ningún dibujo guardado. Se guardan aquí solitos mientras dibujas."></p>
  <div id="meusGrade" class="grade"></div>
  <p class="dica pequena" data-t="Ficam só neste aparelho (até 40). Para guardar para sempre, use 📸 e salve no celular.|Kept only on this device (up to 40). To keep them forever, use 📸 and save to the phone.|Se quedan solo en este dispositivo (hasta 40). Para guardarlos para siempre, usa 📸 y guárdalos en el móvil."></p>
</section>

<section id="tvEscolha" class="tela" data-recurso="rabiscolandia">
  <div class="cabeca">
    <h2 data-t="📺 Desenhar na TV|📺 Draw on the TV|📺 Dibujar en la tele"></h2>
  </div>
  <div class="cartoes-tv">
    <div class="cartao">
      <h3 data-t="Jeito mais fácil: espelhar|Easiest: screen mirroring|Lo más fácil: duplicar la pantalla"></h3>
      <p data-t="Espelhe a tela deste aparelho na TV (Android: Transmitir ou Smart View; iPhone/iPad: Espelhar Tela) e use 🖐 Desenhar com a mão com o aparelho em pé, perto da TV, com a câmera da frente virada para você.|Mirror this device on the TV (Android: Cast or Smart View; iPhone/iPad: Screen Mirroring) and use 🖐 Draw with your hand with the device standing near the TV, front camera facing you.|Duplica la pantalla de este dispositivo en la tele (Android: Enviar o Smart View; iPhone/iPad: Duplicar pantalla) y usa 🖐 Dibujar con la mano con el dispositivo de pie, cerca de la tele, con la cámara frontal mirándote."></p>
      <button id="btTVMao" class="medio" type="button" data-t="🖐 Desenhar com a mão|🖐 Draw with your hand|🖐 Dibujar con la mano"></button>
    </div>
    <div class="cartao">
      <h3 data-t="A TV abre a Rabiscolândia|The TV opens Rabiscolândia|La tele abre Rabiscolândia"></h3>
      <p data-t="Na TV, abra solverone.com.br/tv/rabiscolandia. Ela mostra um código. Aqui, toque em Controlar a TV e digite o código. O celular vira o controle: deslizar o dedo, mexer o celular ou a mão na câmera.|On the TV, open solverone.com.br/tv/rabiscolandia. It shows a code. Here, tap Control the TV and type the code. The phone becomes the remote: slide your finger, move the phone or your hand in the camera.|En la tele, abre solverone.com.br/tv/rabiscolandia. Aparece un código. Aquí, toca Controlar la tele y escribe el código. El móvil se convierte en el mando: desliza el dedo, mueve el móvil o la mano delante de la cámara."></p>
      <div class="linha-menu">
        <button id="btSouTV" class="medio" type="button" data-t="📺 Esta é a TV|📺 This is the TV|📺 Esta es la tele"></button>
        <button id="btSouControle" class="medio rosa" type="button" data-t="🎮 Controlar a TV|🎮 Control the TV|🎮 Controlar la tele"></button>
      </div>
    </div>
  </div>
</section>

<section id="controle" class="tela" data-recurso="rabiscolandia">
  <div class="cabeca">
    <button class="voltar mini" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Atrás">←</button>
    <h2 data-t="🎮 Controle da TV|🎮 TV remote|🎮 Mando de la tele"></h2>
  </div>
  <form id="ctrlEntrar" class="ctrl-entrar">
    <label><span data-t="Código da TV|TV code|Código de la tele"></span> <input id="ctrlCodigo" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD"></label>
    <label><span data-t="Seu nome|Your name|Tu nombre"></span> <input id="ctrlNome" maxlength="16" autocomplete="off" placeholder="Ex.: Ana"></label>
    <button id="ctrlConectar" class="grande" type="submit" data-t="Conectar|Connect|Conectar"></button>
    <p id="ctrlMsg" class="dica" aria-live="polite"></p>
  </form>
  <div id="ctrlPainel" class="ctrl-painel" hidden>
    <div class="chips" role="tablist">
      <button class="chip ctrl-modo" type="button" data-modo="toque" aria-pressed="true" data-t="👆 Dedo|👆 Finger|👆 Dedo"></button>
      <button class="chip ctrl-modo" type="button" data-modo="giro" aria-pressed="false" data-t="📱 Mexer o celular|📱 Move the phone|📱 Mover el móvil"></button>
      <button class="chip ctrl-modo" type="button" data-modo="mao" aria-pressed="false" data-t="🖐 Mão na câmera|🖐 Hand in camera|🖐 Mano en la cámara"></button>
    </div>
    <div id="ctrlArea" class="ctrl-area" aria-label="Área de desenho" data-rotulo="Área de desenho|Drawing pad|Área de dibujo">
      <p id="ctrlDica" class="ctrl-dica"></p>
      <video id="ctrlVideo" class="ctrl-video" playsinline muted hidden></video>
      <canvas id="ctrlPontos" class="ctrl-pontos" width="320" height="240" hidden></canvas>
    </div>
    <div class="linha-ctrl">
      <button id="ctrlSegurar" class="grande" type="button" hidden data-t="✏️ Segure para desenhar|✏️ Hold to draw|✏️ Mantén para dibujar"></button>
      <button id="ctrlCentro" class="medio" type="button" hidden data-t="🎯 Centralizar|🎯 Center|🎯 Centrar"></button>
    </div>
    <div id="ctrlTamanhos" class="faixa-cores" aria-label="Grossura do traço" data-rotulo="Grossura do traço|Line thickness|Grosor del trazo"></div>
    <div id="ctrlCores" class="faixa-cores"></div>
    <div id="ctrlPinceis" class="faixa-cores"></div>
    <div class="linha-ctrl">
      <button id="ctrlDesfazer" class="mini" type="button" aria-label="Desfazer" data-rotulo="Desfazer|Undo|Deshacer">↩</button>
      <button id="ctrlMenos" class="mini" type="button" aria-label="Diminuir" data-rotulo="Diminuir|Zoom out|Alejar">🔍−</button>
      <button id="ctrlAjustar" class="mini" type="button" aria-label="Ajustar" data-rotulo="Ajustar|Fit|Ajustar">⤢</button>
      <button id="ctrlMais" class="mini" type="button" aria-label="Aumentar" data-rotulo="Aumentar|Zoom in|Acercar">🔍+</button>
      <button id="ctrlCarimbo" class="mini" type="button" aria-label="Adesivo" data-rotulo="Adesivo|Sticker|Pegatina">⭐</button>
      <button id="ctrlMusica" class="mini" type="button" aria-label="Música" data-rotulo="Música|Music|Música">🎵</button>
    </div>
  </div>
</section>

<section id="pintar" class="tela" data-recurso="rabiscolandia">
  <div id="topo" class="topo">

      <button id="btDica" class="mini" type="button" hidden aria-label="Dica" data-rotulo="Dica|Hint|Pista">🪄</button>
      <button id="btZoomMais" class="mini so-sem-toque" type="button" aria-label="Aumentar" data-rotulo="Aumentar|Zoom in|Acercar">🔍+</button>
      <button id="btZoomMenos" class="mini so-sem-toque" type="button" aria-label="Diminuir" data-rotulo="Diminuir|Zoom out|Alejar">🔍−</button>
      <button id="btAjustar" class="mini" type="button" aria-label="Ver tudo" data-rotulo="Ver tudo|Fit|Ver todo">⤢</button>
    </div>
    <div id="colinha" class="colinha" hidden><img id="colinhaImg" alt=""><span data-t="Colinha|Cheat sheet|Modelo"></span></div>
    <div id="camBox" class="cam-box" hidden>
      <video id="camVideo" playsinline muted></video>
      <canvas id="camPontos" width="320" height="240"></canvas>
      <p id="camStatus" aria-live="polite"></p>
    </div>
    <p id="avisoPerto" class="aviso-perto" hidden data-t="Use dois dedos para chegar perto e ver os números 🔍|Use two fingers to zoom in and see the numbers 🔍|Usa dos dedos para acercarte y ver los números 🔍"></p>
  </div>
  <div id="barra" class="barra">
    <div id="ferramentas" class="ferramentas"></div>
    <div id="cores" class="faixa-cores"></div>
    <div id="paleta" class="paleta" hidden></div>
  </div>
  <div id="painel" class="painel" hidden role="dialog" aria-modal="false">

    <div id="painelCorpo" class="painel-corpo"></div>
  </div>
</section>
