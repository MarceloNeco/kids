<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AQUA — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#1aa6a6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="AQUA: despeje os líquidos coloridos de um frasco para o outro até cada frasco ficar de uma cor só. Três níveis, fases sem fim, sempre com solução. / AQUA: pour the colorful liquids from bottle to bottle until each one holds a single color. Three levels, endless stages, always solvable.">
<link rel="stylesheet" href="estilo.css">
<!--
  AQUA — brincadeira da família Bolinho de Chuva (SolverONE): despejar líquidos coloridos entre frascos.
  O motor (regras, gerador de fases e resolvedor) fica em motor.js, sem tela, testado no Node; os sons em som.js;
  o desenho dos frascos em desenho.js; a tela, os toques, as ajudas e a lojinha em app.js.
  Sem login, sem banco, sem cookie, sem anúncio e sem compra: as fases vencidas, as estrelas e as gotinhas ficam só
  neste aparelho (localStorage "aqua.pref").
  Nada de script inline: a CSP acima não permite. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>

<section id="menu" class="tela ativa" data-recurso="aqua">
  <div class="faixa">
    <button id="btLingua" class="mini" type="button" aria-label="Idioma / Language">EN</button>
    <button id="btEfeitos" class="mini" type="button" aria-label="Sons / Sounds">🔊</button>
    <button id="btSimbolos" class="mini" type="button" aria-pressed="false" data-rotulo="Desenho em cada cor (ajuda quem confunde as cores)|A shape on each color (helps if colors look alike)">🔣</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como brincar / How to play" aria-expanded="false" aria-controls="ajuda">❓</button>
  </div>
  <img class="mascote" src="icone.svg" alt="" width="120" height="120">
  <h1 class="logo" aria-label="AQUA"><span class="l1" aria-hidden="true">A</span><span class="l2" aria-hidden="true">Q</span><span class="l3" aria-hidden="true">U</span><span class="l4" aria-hidden="true">A</span></h1>
  <p class="sub" data-t="Despeje as cores de um frasco no outro até cada frasco ficar de uma cor só|Pour the colors from bottle to bottle until each bottle holds just one color"></p>
  <div id="ajuda" class="ajuda" hidden>
    <h2 data-t="Como brincar|How to play"></h2>
    <p data-t="👆 Toque num frasco: ele levanta. Toque em outro: a cor de cima despeja nele.|👆 Tap a bottle: it lifts. Tap another one: the top color pours into it."></p>
    <p data-t="🎨 Só dá para despejar num frasco vazio ou em cima da mesma cor, e só o quanto couber.|🎨 You can only pour into an empty bottle or onto the same color, and only as much as fits."></p>
    <p data-t="🍾 Quando um frasco fica cheio de uma cor só, ele ganha uma rolha. Feche todos para passar de fase!|🍾 When a bottle is full of one color, it gets a cork. Close them all to finish the stage!"></p>
    <p data-t="🌫️ No Médio e no Difícil aparecem frascos embaçados: as cores de baixo ficam escondidas até a de cima sair.|🌫️ On Medium and Hard some bottles are foggy: the lower colors stay hidden until the top one leaves."></p>
    <p data-t="🧰 Ajudas, embaixo da tela: ↩️ desfazer, 💡 dica, 🔀 embaralhar e ➕ mais um frasco. Elas nunca custam nada e voltam cheias a cada fase.|🧰 Helpers, at the bottom: ↩️ undo, 💡 hint, 🔀 shuffle and ➕ one more bottle. They never cost anything and refill every stage."></p>
    <p data-t="⭐ Sem usar ajuda, a fase vale 3 estrelas. Cada fase dá gotinhas 💧 para trocar por frascos e cenários na lojinha (tudo de brincadeira, sem dinheiro).|⭐ With no helpers, the stage is worth 3 stars. Each stage gives droplets 💧 to trade for bottles and backdrops in the little shop (all pretend, no money)."></p>
  </div>
  <div class="niveis">
    <button id="btFacil" class="nivel facil" type="button" data-nivel="facil">
      <span class="n-nome" data-t="🫧 Fácil|🫧 Easy"></span>
      <span class="n-info" data-t="3 a 5 cores · sempre com dica|3 to 5 colors · hints always on"></span>
      <span id="recFacil" class="n-rec"></span>
    </button>
    <button id="btMedio" class="nivel medio" type="button" data-nivel="medio">
      <span class="n-nome" data-t="🧪 Médio|🧪 Medium"></span>
      <span class="n-info" data-t="5 a 8 cores · frascos embaçados|5 to 8 colors · foggy bottles"></span>
      <span id="recMedio" class="n-rec"></span>
    </button>
    <button id="btDificil" class="nivel dificil" type="button" data-nivel="dificil">
      <span class="n-nome" data-t="🌋 Difícil|🌋 Hard"></span>
      <span class="n-info" data-t="8 a 12 cores · pouco espaço vazio|8 to 12 colors · little empty room"></span>
      <span id="recDificil" class="n-rec"></span>
    </button>
  </div>
  <div class="linha-loja">
    <span class="gotas" id="gotasMenu" aria-live="polite"><span aria-hidden="true">💧</span><span id="gotasMenuN">0</span></span>
    <button id="btLoja" class="medio-bt" type="button" data-t="🛍️ Lojinha de brincadeira|🛍️ Pretend shop"></button>
  </div>
  <button id="btInstalar" class="medio-bt" type="button" hidden data-t="📲 Instalar|📲 Install"></button>
  <p id="versao" class="versao"></p>
</section>

<section id="jogo" class="tela" data-recurso="aqua">
  <div class="barra">
    <span class="placa" id="placaFase"></span>
    <span class="placa gotas" id="placaGotas"><span aria-hidden="true">💧</span><span id="gotasJogo">0</span></span>
    <button id="btReiniciar" class="mini" type="button" data-rotulo="Recomeçar a fase|Restart the stage">🔄</button>
  </div>
  <div id="area" class="area">
    <canvas id="palco" aria-hidden="true"></canvas>
    <div id="frascos" class="frascos" role="group"></div>
    <p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>
  </div>
  <div class="ajudas" role="group" data-rotulo="Ajudas|Helpers">
    <button id="btDesfazer" class="aj" type="button" data-rotulo="Desfazer a última jogada|Undo the last move"><span class="aj-ico" aria-hidden="true">↩️</span><span class="aj-n" id="nDesfazer"></span></button>
    <button id="btDica" class="aj" type="button" data-rotulo="Dica: mostra uma jogada boa|Hint: shows a good move"><span class="aj-ico" aria-hidden="true">💡</span><span class="aj-n" id="nDica"></span></button>
    <button id="btEmbaralhar" class="aj" type="button" data-rotulo="Embaralhar as cores de novo|Shuffle the colors again"><span class="aj-ico" aria-hidden="true">🔀</span><span class="aj-n" id="nEmbaralhar"></span></button>
    <button id="btExtra" class="aj" type="button" data-rotulo="Mais um frasco vazio|One more empty bottle"><span class="aj-ico" aria-hidden="true">➕</span><span class="aj-n" id="nExtra"></span></button>
  </div>
</section>

<section id="loja" class="tela" data-recurso="aqua">
  <div class="loja-topo">
    <h2 data-t="🛍️ Lojinha de brincadeira|🛍️ Pretend shop"></h2>
    <span class="placa gotas"><span aria-hidden="true">💧</span><span id="gotasLoja">0</span></span>
  </div>
  <p class="loja-sub" data-t="Troque as gotinhas que você ganha nas fases. Aqui nada custa dinheiro e nada deixa o jogo mais fácil: é só para enfeitar.|Trade the droplets you earn in the stages. Nothing here costs money and nothing makes the game easier: it is just for looks."></p>
  <h3 data-t="Frascos|Bottles"></h3>
  <div id="lojaFrascos" class="vitrine"></div>
  <h3 data-t="Cenários|Backdrops"></h3>
  <div id="lojaCenarios" class="vitrine"></div>
  <button id="btLojaVoltar" class="grande" type="button" data-t="✔ Pronto|✔ Done"></button>
</section>

<div id="fim" class="fim" hidden role="dialog" aria-modal="true" aria-labelledby="fimTitulo">
  <div class="cartao">
    <div id="fimEstrelas" class="fim-estrelas" role="img"></div>
    <h2 id="fimTitulo"></h2>
    <p id="fimTexto"></p>
    <p id="fimGotas" class="fim-gotas"></p>
    <div class="fim-botoes">
      <button id="btProxima" class="grande" type="button" data-t="Próxima fase ▶|Next stage ▶"></button>
      <button id="btDeNovo" class="medio-bt" type="button" data-t="🔄 Jogar esta de novo|🔄 Play this one again"></button>
      <button id="btNiveis" class="medio-bt" type="button" data-t="🏡 Escolher nível|🏡 Choose level"></button>
    </div>
  </div>
</div>

<script src="motor.js"></script>
<script src="som.js"></script>
<script src="desenho.js"></script>
<script src="../recursos.js" data-app="kids" data-fora-do-arquivo></script>
<script src="../idioma.js" data-fora-do-arquivo></script>
<script src="../navegacao.js" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../trilha.js" data-fora-do-arquivo></script>
<script src="app.js"></script>
</body>
</html>
