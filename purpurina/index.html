<!--
  Purpurina — quinta brincadeira da família Bolinho de Chuva (SolverONE · Feature Tester).
  Jogo de vestir e maquiar: personagem (pele, cabelo, olhos), maquiagem, roupas, acessórios e cenários,
  com desfazer, surpresa, desafios com estrelas, desfile com festa, foto do visual e looks favoritos.
  Sem login, sem banco, sem cookie: só arquivos estáticos (cache no aparelho pelo sw.js). Nada de
  script inline: a CSP acima não permite. Mapa dos arquivos: LEIA-ME.md.
  Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>

<section id="menu" class="tela" data-recurso="purpurina">

    <button id="btProxMusicaMenu" class="mini" type="button" aria-label="Próxima música" data-rotulo="Próxima música|Next song|Siguiente canción">⏭</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como brincar" data-rotulo="Como brincar|How to play|Cómo jugar" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo pequeno">Purpurina</h1>
  <div id="ajuda" class="ajuda" hidden>
    <p data-t="Monte o visual da sua personagem: escolha a pele, o cabelo, as mechas e os olhos, faça a maquiagem (base, blush, sombra, delineado, cílios, batom, glitter e adesivos), vista roupas e sapatos, coloque joias (brincos, colares, pulseiras, anéis e broches) e acessórios. Toque numa aba embaixo (👧 💄 👗 💎 👑 🏞️), depois numa parte e numa opção. As bolinhas coloridas trocam a cor.|Style your character: pick skin, hair, highlights and eyes, do the makeup (foundation, blush, eyeshadow, eyeliner, lashes, lipstick, glitter and stickers), choose clothes and shoes, add jewelry (earrings, necklaces, bracelets, rings and brooches) and accessories. Tap a tab at the bottom (👧 💄 👗 💎 👑 🏞️), then a part and an option. The colored dots change the color.|Arma el look de tu personaje: elige la piel, el pelo, los mechones y los ojos, maquíllala (base, rubor, sombra, delineador, pestañas, labial, brillitos y calcomanías), ponle ropa y zapatos, joyas (aretes, collares, pulseras, anillos y broches) y accesorios. Toca una pestaña abajo (👧 💄 👗 💎 👑 🏞️), luego una parte y una opción. Los circulitos de colores cambian el color."></p>
    <p data-t="🔍 Zoom: na maquiagem e nas joias a tela chega perto sozinha (rosto, colar ou mãos). O botão 🔍 lá em cima chega perto e o 👗 volta a mostrar a personagem inteira.|🔍 Zoom: for makeup and jewelry the screen zooms in by itself (face, necklace or hands). The 🔍 button at the top zooms in and 👗 shows the whole character again.|🔍 Zoom: en el maquillaje y en las joyas la pantalla se acerca sola (cara, collar o manos). El botón 🔍 de arriba acerca la imagen y el 👗 vuelve a mostrar al personaje entero."></p>
    <p data-t="↩ desfaz a última troca, 🎲 sorteia um visual surpresa e 🔄 começa de novo. 📸 tira uma foto para guardar no celular e 💖 guarda o look nos favoritos. Para tirar uma peça (uma tiara, um brinco…), toque em ✕ Tirar em cima das opções, ou toque de novo na peça escolhida.|↩ undoes the last change, 🎲 picks a surprise look and 🔄 starts over. 📸 takes a photo to save on the phone and 💖 saves the look to favorites. To take something off (a tiara, an earring…), tap ✕ Remove above the options, or tap the chosen piece again.|↩ deshace el último cambio, 🎲 elige un look sorpresa y 🔄 empieza de nuevo. 📸 toma una foto para guardarla en el celular y 💖 guarda el look en tus favoritos. Para quitar algo (una tiara, un arete…), toca ✕ Quitar encima de las opciones, o vuelve a tocar la prenda elegida."></p>
    <p data-t="🔄 Girar: arraste o dedo para os lados em cima da personagem para ver de frente, de lado e de costas. Um toque nela (ou no ↻) dá uma volta inteira com rastro de luz; o 🙂 volta para a frente.|🔄 Spin: drag sideways on the character to see her front, side and back. One tap on her (or on ↻) does a full turn with a light trail; 🙂 turns her to the front again.|🔄 Girar: desliza el dedo de lado a lado sobre el personaje para verlo de frente, de lado y de espaldas. Un toque (o el ↻) le da una vuelta entera con estela de luz; el 🙂 lo pone de frente otra vez."></p>
    <p data-t="⭐ Desafios: monte o visual para o tema, siga as 3 dicas e toque em ✨ Desfilar! Ninguém perde: todo desfile ganha pelo menos 1 estrela.|⭐ Challenges: style a look for the theme, follow the 3 tips and tap ✨ Runway! Nobody loses: every show gets at least 1 star.|⭐ Desafíos: arma el look para el tema, sigue las 3 pistas y toca ✨ ¡Desfila! Nadie pierde: cada desfile gana por lo menos 1 estrella."></p>
  </div>

    <button id="btDesafios" class="grande roxo" type="button" data-t="⭐ Desafios|⭐ Challenges|⭐ Desafíos"></button>
    <button id="btLooks" class="medio" type="button"><span data-t="💖 Meus looks|💖 My looks|💖 Mis looks"></span> <span id="qtdLooks" class="bolha">0</span></button>
    <div class="linha-menu">
      <button id="btMusica" class="medio" type="button" data-t="🎵 Música|🎵 Music|🎵 Música"></button>
      <button id="btTV" class="medio" type="button" data-so-site data-t="📺 Conectar na TV|📺 Connect to TV|📺 Conectar a la TV"></button>

  <p class="rodape"><span id="ver"></span> · SolverONE · <a href="https://solverone.com.br/kids/" data-t="🍩 Mais brincadeiras|🍩 More games|🍩 Más juegos"></a></p>

<section id="conectar" class="tela" data-recurso="purpurina">
  <div class="topo-simples">
    <button class="mini voltar" type="button" aria-label="Voltar" data-rotulo="Voltar|Back|Volver">⬅</button>
    <h2 data-t="📺 Conectar na TV|📺 Connect to TV|📺 Conectar a la TV"></h2>
  </div>
  <ol class="passos">
    <li data-t="Na TV, abra o navegador e digite: solverone.com.br/tv/purpurina (ou solverone.com.br/kids e escolha a Purpurina). Aparece um código de 4 letras.|On the TV, open the browser and type: solverone.com.br/tv/purpurina (or solverone.com.br/kids and pick Purpurina). A 4-letter code shows up.|En la TV, abre el navegador y escribe: solverone.com.br/tv/purpurina (o solverone.com.br/kids y elige Purpurina). Aparece un código de 4 letras."></li>
    <li data-t="Digite aqui o código e o seu nome e toque em Conectar.|Type the code and your name here and tap Connect.|Escribe aquí el código y tu nombre, y toca Conectar."></li>
    <li data-t="Pronto: sua personagem aparece grande na TV, e tudo o que você fizer aqui aparece lá. Até 4 celulares ao mesmo tempo!|Done: your character shows big on the TV, and everything you do here shows there. Up to 4 phones at once!|¡Listo! Tu personaje aparece grande en la TV, y todo lo que hagas aquí aparece allá. ¡Hasta 4 celulares al mismo tiempo!"></li>
  </ol>
  <div id="formConectar" class="form-conectar">
    <label><span data-t="Código da TV|TV code|Código de la TV"></span><input id="codigoTV" class="campo codigo" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text"></label>
    <label><span data-t="Seu nome|Your name|Tu nombre"></span><input id="nomeTV" class="campo" maxlength="16" autocomplete="off"></label>
    <button id="btConectar" class="grande" type="button" data-t="📺 Conectar|📺 Connect|📺 Conectar"></button>
  </div>
  <button id="btDesconectar" class="medio" type="button" hidden data-t="✕ Desconectar da TV|✕ Disconnect from the TV|✕ Desconectar de la TV"></button>
  <p id="conectarAviso" class="dica" aria-live="polite"></p>
  <p class="dica" data-t="Outro jeito: espelhar a tela do celular na TV (no Android: Transmitir ou Smart View; no iPhone: Espelhar Tela).|Another way: mirror the phone screen on the TV (Android: Cast or Smart View; iPhone: Screen Mirroring).|Otra forma: duplicar la pantalla del celular en la TV (en Android: Transmitir o Smart View; en iPhone: Duplicar pantalla)."></p>
</section>
