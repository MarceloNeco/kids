<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TIJOLAÇO — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="../carregando.js" data-fora-do-arquivo></script>
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#1c252d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="TIJOLAÇO: o jogo da obra. No modo TijoLinto, a betoneira-canhão atira tijolos na fila que rola pela canaleta: junte 3 da mesma cor antes que ela chegue à caçamba, e abra os portões para ganhar tempo. / BrickFreak: the building-site game. In Brickrinth mode, the mixer cannon shoots bricks at the line rolling down the channel: match 3 of a colour before it reaches the dumpster, and open the gates to buy time. / Ladrillolío: el juego de la obra. En el modo Ladrilaberinto, la hormigonera-cañón lanza ladrillos a la fila que rueda por la canaleta: junta 3 del mismo color antes de que llegue al contenedor y abre las puertas para ganar tiempo.">
<link rel="stylesheet" href="estilo.css">
<!--
  TIJOLAÇO / BrickFreak / Ladrillolío — o jogo da obra da família Bolinho de Chuva (SolverONE · kids).
  Hoje: o modo TijoLinto (fila de tijolos num labirinto de canaletas). Os outros 4 modos aparecem como "Em breve".
  Regras sem tela (regras.js), fases (fases.js), desenho em canvas (arte.js), efeitos (som.js), telas e botões (app.js).
  Música: a trilha comum (../trilha.js). Sem login, sem banco: tudo fica no aparelho.
  Nada de script inline: a CSP acima não permite. Mapa: LEIA-ME.md. Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>
<canvas id="cena" aria-label="Canteiro de obra do TIJOLAÇO" data-rotulo="Canteiro de obra do TIJOLAÇO|BrickFreak building site|Obra de Ladrillolío"></canvas>

<section id="menu" class="tela ativa" data-recurso="tijolaco">
  <h1 id="letreiro" class="letreiro" aria-label="TIJOLAÇO"></h1>
  <div class="painel">
    <div class="modos" role="radiogroup" aria-label="Modo de jogo" data-rotulo="Modo de jogo|Game mode|Modo de juego">
      <button id="mdLinto" class="modo destaque" type="button" role="radio" aria-checked="true">
        <span class="mo-texto">
          <span class="mo-nome" data-t="TijoLinto|Brickrinth|Ladrilaberinto"></span>
          <span class="mo-desc" data-t="Atire tijolos e junte 3 iguais antes que a fila chegue à caçamba.|Shoot bricks and match 3 before the line reaches the dumpster.|Lanza ladrillos y junta 3 iguales antes de que la fila llegue al contenedor."></span>
        </span>
        <span id="filaDemo" class="fila-demo" aria-hidden="true"></span>
      </button>
      <div class="mini-modos">
        <div class="modo breve" aria-disabled="true">
          <svg class="mo-ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="30" width="16" height="10" rx="2" fill="#d0623f"/><rect x="24" y="30" width="18" height="10" rx="2" fill="#d0623f"/><rect x="14" y="19" width="18" height="10" rx="2" fill="#e07a4f"/><rect x="18" y="4" width="12" height="9" rx="2" fill="#f2a516"/><path d="M24 14v3" stroke="#f2a516" stroke-width="2" stroke-dasharray="2 2"/></svg>
          <span class="mo-nome" data-t="Obra|Build|Obra"></span>
          <span class="fita" data-t="Em breve|Soon|Pronto"></span>
        </div>
        <div class="modo breve" aria-disabled="true">
          <svg class="mo-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 4h32" stroke="#9aa3ab" stroke-width="3"/><path d="M24 4l-6 18" stroke="#9aa3ab" stroke-width="2" stroke-dasharray="3 2"/><circle cx="16" cy="28" r="9" fill="#4b5258"/><circle cx="13" cy="25" r="3" fill="#8d959c"/><rect x="30" y="30" width="12" height="8" rx="1.5" fill="#d0623f"/><rect x="33" y="21" width="9" height="8" rx="1.5" fill="#e07a4f"/></svg>
          <span class="mo-nome" data-t="Demolição|Demolition|Demolición"></span>
          <span class="fita" data-t="Em breve|Soon|Pronto"></span>
        </div>
        <div class="modo breve" aria-disabled="true">
          <svg class="mo-ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="5" width="11" height="11" rx="2" fill="#2f7fd8"/><rect x="18.5" y="5" width="11" height="11" rx="2" fill="#3aa84a"/><rect x="32" y="5" width="11" height="11" rx="2" fill="#2f7fd8"/><rect x="5" y="18.5" width="11" height="11" rx="2" fill="#f2a516"/><rect x="18.5" y="18.5" width="11" height="11" rx="2" fill="#2f7fd8"/><rect x="32" y="18.5" width="11" height="11" rx="2" fill="#d0623f"/><rect x="5" y="32" width="11" height="11" rx="2" fill="#8a5a2e"/><rect x="18.5" y="32" width="11" height="11" rx="2" fill="#2f7fd8"/><rect x="32" y="32" width="11" height="11" rx="2" fill="#3aa84a"/></svg>
          <span class="mo-nome" data-t="Canteiro|Brickyard|Almacén"></span>
          <span class="fita" data-t="Em breve|Soon|Pronto"></span>
        </div>
        <div class="modo breve" aria-disabled="true">
          <svg class="mo-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24L24 8l18 16" fill="none" stroke="#e5532d" stroke-width="4" stroke-linejoin="round"/><rect x="11" y="22" width="26" height="20" fill="#f0d8c0"/><path d="M11 28h26M11 34h26M20 22v6M28 28v6M20 34v8" stroke="#c9a585" stroke-width="1.3"/><path d="M15 16a9 9 0 0 1 18 0z" fill="#ffd23f"/><rect x="12" y="15" width="24" height="3" rx="1.5" fill="#e0a800"/></svg>
          <span class="mo-nome" data-t="Mutirão|All Hands|Todos a Una"></span>
          <span class="fita" data-t="Em breve|Soon|Pronto"></span>
        </div>
      </div>
    </div>
    <div class="coluna">
      <div class="grupo">
        <span class="rotulo" data-t="Nível|Level|Nivel"></span>
        <div class="seg" role="radiogroup" aria-label="Nível" data-rotulo="Nível|Level|Nivel">
          <button class="chip verde" type="button" role="radio" data-nivel="facil" aria-checked="true" data-t="Fácil|Easy|Fácil"></button>
          <button class="chip amarelo" type="button" role="radio" data-nivel="medio" aria-checked="false" data-t="Médio|Medium|Medio"></button>
          <button class="chip vermelho" type="button" role="radio" data-nivel="dificil" aria-checked="false" data-t="Difícil|Hard|Difícil"></button>
        </div>
      </div>
      <div id="fases" class="fases" role="radiogroup" aria-label="Fase" data-rotulo="Fase|Level|Fase"></div>
      <button id="btJogar" class="jogar" type="button"></button>
      <div class="rodape">
        <button id="btAjuda" class="mini" type="button" aria-label="Como jogar" data-rotulo="Como jogar|How to play|Cómo se juega">❓</button>
        <button id="btEfeitos" class="mini" type="button" aria-label="Sons" data-rotulo="Sons|Sounds|Sonidos">🔊</button>
        <button id="btInstalar" class="mini" type="button" hidden data-t="📲 Instalar|📲 Install|📲 Instalar"></button>
        <p id="versao" class="versao"></p>
      </div>
    </div>
  </div>
</section>

<section id="jogo" class="tela" data-recurso="tijolaco">
  <div id="hud" class="hud">
    <div class="hud-info">
      <span id="hudFase" class="hud-fase"></span>
      <b id="hudPontos" class="hud-pontos">0</b>
    </div>
    <div id="barra" class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Barra da Obra" data-rotulo="Barra da Obra|Build bar|Barra de la Obra">
      <div id="barraEnche" class="enche"></div>
      <span class="barra-rot" data-t="Obra|Build|Obra"></span>
    </div>
    <div id="hudEfeitos" class="efeitos"></div>
  </div>
  <p id="faixa" class="faixa" role="status" aria-live="polite" hidden></p>
</section>

<div id="fim" class="fim" hidden role="dialog" aria-modal="true" aria-labelledby="fimTitulo">
  <div class="fim-caixa">
    <div id="fimEstrelas" class="estrelas" aria-hidden="true"></div>
    <h2 id="fimTitulo"></h2>
    <p id="fimTexto" class="fim-texto"></p>
    <div class="fim-numeros">
      <div><span data-t="Pontos|Score|Puntos"></span><b id="fimPontos">0</b></div>
      <div><span data-t="Maior combo|Best combo|Mejor combo"></span><b id="fimCombo">0</b></div>
      <div id="fimOuroBox"><span data-t="Tijolo de ouro|Golden brick|Ladrillo de oro"></span><b id="fimOuro">0</b></div>
    </div>
    <div class="fim-botoes">
      <button id="btProxima" class="jogar" type="button" data-t="▶ Próxima fase|▶ Next level|▶ Siguiente fase"></button>
      <button id="btDeNovo" class="mini largo" type="button" data-t="🔄 Jogar de novo|🔄 Play again|🔄 Jugar otra vez"></button>
      <button id="btFimMenu" class="mini largo" type="button" data-t="🏠 Começo|🏠 Start|🏠 Inicio"></button>
    </div>
  </div>
</div>

<div id="ajuda" class="fim" hidden role="dialog" aria-modal="true" aria-labelledby="ajudaTitulo">
  <div class="fim-caixa ajuda-caixa">
    <h2 id="ajudaTitulo" data-t="Como jogar|How to play|Cómo se juega"></h2>
    <ul class="ajuda-lista">
      <li data-t="🎯 Aponte com o dedo (ou o mouse) e solte: a betoneira atira o tijolo.|🎯 Aim with your finger (or the mouse) and let go: the mixer shoots the brick.|🎯 Apunta con el dedo (o el ratón) y suelta: la hormigonera lanza el ladrillo."></li>
      <li data-t="🧱 Junte 3 ou mais da mesma cor e eles quebram. Cada material tem seu desenho: tijolo, azulejo, tinta, telha, madeira e pedra.|🧱 Match 3 or more of the same colour and they break. Each material has its own pattern: brick, tile, paint, roof tile, wood and stone.|🧱 Junta 3 o más del mismo color y se rompen. Cada material tiene su dibujo: ladrillo, azulejo, pintura, teja, madera y piedra."></li>
      <li data-t="🔁 Toque na betoneira (ou Espaço) para trocar pelo próximo tijolo.|🔁 Tap the mixer (or Space) to swap with the next brick.|🔁 Toca la hormigonera (o Espacio) para cambiar por el siguiente ladrillo."></li>
      <li data-t="🧲 Se as pontas do buraco tiverem a mesma cor, o ímã puxa a fila de volta: combo x2, x3…|🧲 If both sides of a gap match, the magnet pulls the line back: combo x2, x3…|🧲 Si los dos lados del hueco son del mismo color, el imán tira de la fila: ¡combo x2, x3…!"></li>
      <li data-t="🚧 Toque nos portões numerados para mandar a fila pelo caminho mais comprido e ganhar tempo (com cadeado, a fila já está passando).|🚧 Tap the numbered gates to send the line the long way round and buy time (a padlock means the line is going through).|🚧 Toca las puertas con número para mandar la fila por el camino largo y ganar tiempo (con candado, la fila ya está pasando)."></li>
      <li data-t="⭐ Poderes nos tijolos: marreta, ré do rolo, sinal vermelho e fio de prumo. Acerte o capacete dourado e atire pelas brechas da fila para ganhar mais.|⭐ Powers on the bricks: sledgehammer, reverse roller, red light and plumb line. Hit the golden hard hat and shoot through gaps in the line for extra points.|⭐ Poderes en los ladrillos: mazo, marcha atrás, semáforo rojo y plomada. Dale al casco dorado y dispara por los huecos de la fila para ganar más."></li>
      <li data-t="🏗️ Encha a Barra da Obra e quebre o resto: obra pronta! Se a fila cair na caçamba, tente de novo.|🏗️ Fill the Build bar and break the rest: job done! If the line falls into the dumpster, try again.|🏗️ Llena la Barra de la Obra y rompe el resto: ¡obra terminada! Si la fila cae en el contenedor, inténtalo otra vez."></li>
      <li data-t="⌨️ Teclado e TV: ← → giram, OK atira, ↑ ou Espaço troca, os números (ou Tab e ↓) mexem nos portões.|⌨️ Keyboard and TV: ← → turn, OK shoots, ↑ or Space swaps, the numbers (or Tab and ↓) work the gates.|⌨️ Teclado y tele: ← → giran, OK dispara, ↑ o Espacio cambia, los números (o Tab y ↓) mueven las puertas."></li>
    </ul>
    <div class="fim-botoes"><button id="btFecharAjuda" class="jogar" type="button" data-t="Entendi!|Got it!|¡Entendido!"></button></div>
  </div>
</div>

<section id="desligado" class="tela" hidden>
  <h2 data-t="O TIJOLAÇO está descansando agora.|BrickFreak is resting right now.|Ladrillolío está descansando ahora."></h2>
</section>

<script src="regras.js"></script>
<script src="fases.js"></script>
<script src="arte.js"></script>
<script src="som.js"></script>
<script src="../recursos.js" data-app="kids" data-fora-do-arquivo></script>
<script src="../idioma.js" data-fora-do-arquivo></script>
<script src="../navegacao.js" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../carrossel.js" data-fora-do-arquivo></script>
<script src="../trilha.js"></script>
<script src="app.js"></script>
</body>
</html>
