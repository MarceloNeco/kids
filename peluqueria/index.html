<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Peluqueria — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#0b0a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="O provador maluco da família: pare o item na hora certa e ganhe pontos. / The family's crazy fitting room: stop the item at the right moment.">
<link rel="stylesheet" href="estilo.css">
<!--
  Peluqueria — segunda brincadeira da família Bolinho de Chuva (SolverONE · Feature Tester).
  Um item (coroa, bigode, peruca…) desce sobre uma imagem; toque em qualquer ponto para parar.
  Quanto mais perto do lugar certo, mais pontos. Sem login, sem banco, sem cookie: só arquivos
  estáticos (cache no aparelho pelo sw.js). Nenhum script inline: a CSP acima não permite.
  Mapa dos arquivos: LEIA-ME.md. Versão: APP_VERSION em app.js e VERSAO em sw.js.
-->
</head>
<body>

<section id="entrada" class="tela ativa" data-recurso="peluqueria">
  <div class="luzes" aria-hidden="true"><div class="feixe a"></div><div class="feixe b"></div><div class="feixe c"></div><div class="brilhos"></div></div>
  <h1 class="logo">Peluqueria</h1>
  <p class="sub" data-t="o provador maluco da família|the family's crazy fitting room|el probador loco de la familia"></p>
  <button id="btEntrar" class="grande entrar" type="button" data-t="🎵 Toque para começar a festa!|🎵 Tap to start the party!|🎵 ¡Toca para empezar la fiesta!"></button>
  <p class="dica" data-t="Aumente o volume 🔊|Turn the volume up 🔊|Sube el volumen 🔊"></p>
</section>

<section id="inicio" class="tela" data-recurso="peluqueria">
  <div class="luzes" aria-hidden="true"><div class="feixe a"></div><div class="feixe b"></div><div class="feixe c"></div><div class="brilhos"></div></div>
  <div id="flutuantes" class="flutuantes" aria-hidden="true"></div>
  <div class="faixa">
    <button id="btSom" class="mini" type="button" aria-label="Som" data-rotulo="Som|Sound|Sonido">🔊</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como jogar" data-rotulo="Como jogar|How to play|Cómo jugar">❓</button>
  </div>
  <h1 class="logo">Peluqueria</h1>
  <p class="sub" data-t="o provador maluco da família|the family's crazy fitting room|el probador loco de la familia"></p>
  <div id="ajuda" class="ajuda" hidden>
    <p data-t="Um item vai descer sobre a imagem. Toque em qualquer ponto da tela para ele parar. Quanto mais perto do lugar certo, mais pontos: Perfeito vale 100, Bom 60, Quase 30. Acertos seguidos multiplicam até ×3. São 10 quedas por rodada.|An item will fall over the picture. Tap anywhere on the screen to stop it. The closer to the right spot, the more points: Perfect is 100, Good 60, Almost 30. Hits in a row multiply up to ×3. 10 drops per round.|Un objeto va a caer sobre la imagen. Toca en cualquier parte de la pantalla para detenerlo. Cuanto más cerca del lugar correcto, más puntos: Perfecto vale 100, Bien 60, Casi 30. Los aciertos seguidos multiplican hasta ×3. Son 10 caídas por ronda."></p>
  </div>
  <div class="niveis" role="group" aria-label="Nível" data-rotulo="Nível|Level|Nivel">
    <button id="btCrianca" class="nivel crianca" type="button" data-nivel="crianca"><span data-t="Criança|Kids|Niños"></span></button>
    <button id="btNormal" class="nivel normal" type="button" data-nivel="normal"><span data-t="Normal|Normal|Normal"></span></button>
    <button id="btMaluco" class="nivel maluco" type="button" data-nivel="maluco"><span data-t="Maluco|Crazy|Loco"></span></button>
  </div>
  <button id="btMinhas" class="chave" type="button" aria-pressed="false" hidden><span data-t="Minhas imagens|My pictures|Mis imágenes"></span></button>
  <button id="btJogar" class="grande" type="button" data-t="Jogar|Play|Jugar"></button>
  <div class="modos-tv">
    <button id="btTV" class="medio" type="button" data-t="📺 Jogar na TV|📺 Play on the TV|📺 Jugar en la tele"></button>
    <button id="btControle" class="medio" type="button" data-t="📱 Sou o controle|📱 I'm the controller|📱 Soy el mando"></button>
  </div>
  <p id="tocando" class="rodape tocando" aria-live="polite"></p>
  <p class="rodape"><span id="ver"></span> · SolverONE · Bolinho de Chuva</p>
</section>

<section id="contagem" class="tela">
  <div id="numero" class="numero">3</div>
</section>

<section id="rodada" class="tela">
  <canvas id="palco"></canvas>
  <div class="placar"><span id="pontos">0</span><span id="mult" class="mult" hidden></span><span id="queda">1/10</span></div>
  <button id="btPausa" class="mini pausa" type="button" aria-label="Pausar" data-rotulo="Pausar|Pause|Pausa"><span class="barras" aria-hidden="true"></span></button>
  <button id="btSeguir" class="seguir" type="button" aria-label="Continuar" data-rotulo="Continuar|Resume|Seguir" hidden>▶</button>
</section>

<section id="fim" class="tela">
  <h2 data-t="Fim da rodada!|Round over!|¡Fin de la ronda!"></h2>
  <div id="estrelas" class="estrelas" aria-live="polite"></div>
  <p class="total"><span id="total">0</span> <span data-t="pontos|points|puntos"></span></p>
  <p id="novoRecorde" class="recorde-novo" hidden data-t="Novo recorde!|New record!|¡Nuevo récord!"></p>
  <p class="recorde"><span data-t="Recorde|Record|Récord"></span>: <span id="recorde">0</span></p>
  <p class="perfeitos"><span data-t="Perfeitos|Perfects|Perfectos"></span>: <span id="perfeitos">0</span></p>
  <button id="btDeNovo" class="grande" type="button" data-t="Jogar de novo|Play again|Jugar otra vez"></button>
  <button id="btInicio" class="medio" type="button" data-t="Início|Home|Inicio"></button>
</section>

<!-- ===== TV ===== -->
<section id="tvLobby" class="tela">
  <h1 class="logo">Peluqueria</h1>
  <p class="tv-passo" data-t="No celular, abra solverone.com.br/kids/peluqueria, toque em 📱 Sou o controle e digite o código:|On the phone, open solverone.com.br/kids/peluqueria, tap 📱 I'm the controller and type the code:|En el móvil, abre solverone.com.br/kids/peluqueria, toca 📱 Soy el mando y escribe el código:"></p>
  <div id="codigo" class="codigo" aria-live="polite">····</div>
  <div id="tvJogadores" class="tv-jogadores" aria-live="polite"></div>
  <p class="tv-nivel"><span data-t="Nível|Level|Nivel"></span>: <b id="tvNivel"></b></p>
  <p class="tv-passo pequeno" data-t="🔊 A música começa no primeiro botão do controle.|🔊 Music starts with the first button on the remote.|🔊 La música empieza con el primer botón del mando."></p>
  <p class="tv-passo pequeno" data-t="Até 2 celulares. Sem celular, aperte OK no controle da TV para jogar sozinho.|Up to 2 phones. No phone? Press OK on the TV remote to play alone.|Hasta 2 móviles. ¿No hay móvil? Pulsa OK en el mando de la tele para jugar solo."></p>
  <button id="tvComecar" class="grande" type="button" data-t="Começar (OK)|Start (OK)|Empezar (OK)"></button>
  <p id="tvAviso" class="tv-passo pequeno"></p>
</section>

<section id="tvJogo" class="tela">
  <div class="tv-area">
    <div class="tv-lado"><canvas id="tvPalco0"></canvas><div class="tv-placar"><span id="tvNome0"></span> <b id="tvPontos0">0</b> <span id="tvMult0" class="mult"></span></div></div>
    <div class="tv-lado" id="tvLado1"><canvas id="tvPalco1"></canvas><div class="tv-placar"><span id="tvNome1"></span> <b id="tvPontos1">0</b> <span id="tvMult1" class="mult"></span></div></div>
  </div>
  <div id="tvQueda" class="tv-queda">1/10</div>
</section>

<section id="tvFim" class="tela">
  <h2 data-t="Fim da rodada!|Round over!|¡Fin de la ronda!"></h2>
  <div id="tvPodio" class="tv-podio" aria-live="polite"></div>
  <p class="tv-passo" data-t="OK ou o celular: jogar de novo · Voltar: lobby|OK or the phone: play again · Back: lobby|OK o el móvil: jugar otra vez · Atrás: sala de espera"></p>
</section>

<!-- ===== Celular como controle ===== -->
<section id="controle" class="tela">
  <h2 data-t="📱 Controle da TV|📱 TV controller|📱 Mando de la tele"></h2>
  <div id="ctEntrada" class="ct-entrada">
    <label><span data-t="Código da TV|TV code|Código de la tele"></span><input id="ctCodigo" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text"></label>
    <label><span data-t="Seu nome|Your name|Tu nombre"></span><input id="ctNome" maxlength="14" autocomplete="off"></label>
    <button id="ctEntrar" class="grande" type="button" data-t="Entrar|Join|Entrar"></button>
  </div>
  <div id="ctPainel" class="ct-painel" hidden>
    <p id="ctStatus" class="ct-status" aria-live="polite"></p>
    <div id="ctNiveis" class="niveis">
      <button id="ctCrianca" class="nivel crianca" type="button" data-nivel-tv="crianca" data-t="Criança|Kids|Niños"></button>
      <button id="ctNormal" class="nivel normal" type="button" data-nivel-tv="normal" data-t="Normal|Normal|Normal"></button>
      <button id="ctMaluco" class="nivel maluco" type="button" data-nivel-tv="maluco" data-t="Maluco|Crazy|Loco"></button>
    </div>
    <button id="ctComecar" class="grande" type="button" data-t="Começar|Start|Empezar"></button>
    <button id="ctParar" class="ct-parar" type="button" data-t="PARAR!|STOP!|¡ALTO!"></button>
    <div class="ct-corpo">
      <button id="ctCorpo" class="chave" type="button" aria-pressed="false" data-t="📷 Usar o corpo|📷 Use your body|📷 Usar el cuerpo"></button>
      <button id="ctDois" class="chave" type="button" aria-pressed="false" hidden data-t="👯 2 pessoas neste celular|👯 2 people on this phone|👯 2 personas en este móvil"></button>
      <p id="ctDicaCorpo" class="dica" hidden data-t="Deixe o celular de pé, filmando quem joga. Levante um braço ou chute de repente para parar. Tremidinha não conta.|Stand the phone up, filming the players. Raise an arm or kick suddenly to stop. Small wiggles don't count.|Deja el móvil de pie, grabando a quien juega. Levanta un brazo o da una patada de repente para detenerlo. Los movimientos pequeñitos no cuentan."></p>
      <div id="ctCamera" class="ct-camera" hidden><video id="ctVideo" muted playsinline></video><canvas id="ctEsq"></canvas></div>
    </div>
  </div>
</section>

<section id="desligado" class="tela">
  <p data-t="Esta brincadeira está desligada no momento.|This game is turned off right now.|Este juego está apagado por ahora."></p>
</section>

<div id="aviso" class="sr" aria-live="polite"></div>
<div id="debug" class="debug" hidden></div>

<script src="jogo.js"></script>
<script src="cenarios.js"></script>
<script src="itens.js"></script>
<script src="desenho.js"></script>
<script src="som.js"></script>
<script src="voz.js"></script>
<script src="gesto.js"></script>
<script src="partida.js"></script>
<script src="sala.js"></script>
<script src="esqueleto.js"></script>
<script src="../recursos.js" data-app="kids"></script>
<script src="../idioma.js" data-fora-do-arquivo></script>
<script src="../navegacao.js" data-fora-do-arquivo></script>
<script src="../atualizar.js" data-fora-do-arquivo></script>
<script src="../telacheia.js" data-fora-do-arquivo></script>
<script src="../versao.js" data-alvo="#entrada" data-fora-do-arquivo defer></script>
<script src="../trilha.js" data-fora-do-arquivo></script>
<script src="app.js"></script>
<script src="tv.js"></script>
<script src="controle.js"></script>
</body>
</html>
