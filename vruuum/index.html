<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="description" content="Corrida de carrinho para a família: desvie, pegue estrelas, pule rampas e passe por 4 mundos. 1 ou 2 jogadores. / Family kart race: dodge, grab stars, jump ramps across 4 worlds.">
<link rel="stylesheet" href="estilo.css">
<!--
  Vruuum! — quarta brincadeira da família Bolinho de Chuva (SolverONE · Feature Tester).
  Corrida de carrinho em 3D: desviar do trânsito, dos cones e da lama, pegar estrelas, turbo de
  arco-íris e rampas, passando por 4 mundos (praia, floresta, doces, neve, cidade neon).
  1 jogador ou 2 na mesma tela (dividida). Toque, teclado, controle de videogame, controle da TV
  ou o acelerômetro do celular. Sem login, sem banco, sem cookie: só arquivos estáticos (cache no aparelho
  pelo sw.js). Nenhum script inline: a CSP acima não permite. Mapa dos arquivos: LEIA-ME.md.
  Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body class="com-demo">

<!-- corrida de demonstração: atrás da apresentação e do menu (a mesma, sem cortar ao entrar no menu) -->
<canvas id="demo" class="demo" aria-hidden="true"></canvas>
<div class="demo-escuro" aria-hidden="true"></div>

<section id="entrada" class="tela ativa" data-recurso="vruuum">
  <!-- logo animado em SVG (leve): riscos de velocidade, chamas, letras em 3D entrando de lado e brilhos -->
  <h1 class="logo-intro"><svg viewBox="0 0 640 250" role="img" aria-label="Vruuum!">
    <defs>
      <linearGradient id="lgOuro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbc2"/><stop offset=".42" stop-color="#ffd23f"/><stop offset=".72" stop-color="#ff8c1a"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
      <linearGradient id="lgFogo" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff3a0"/><stop offset=".4" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
    </defs>
    <g class="lg-riscos">
      <rect x="20" y="70" width="180" height="7" rx="3.5" fill="#2bf4ff"/><rect x="60" y="112" width="140" height="6" rx="3" fill="#ffffff"/>
      <rect x="0" y="150" width="210" height="8" rx="4" fill="#ff4fd8"/><rect x="80" y="186" width="120" height="5" rx="2.5" fill="#c6ff3d"/>
    </g>
    <g class="lg-chamas"><path d="M150 95 C 95 80, 60 120, 0 110 C 50 130, 60 150, 10 170 C 80 165, 110 190, 150 175 Z" fill="url(#lgFogo)"/></g>
    <g class="lg-texto" font-family="Fredoka, sans-serif" font-weight="700" font-style="italic" font-size="150" text-anchor="middle">
      <text x="338" y="186" fill="#3b0f6b">Vruuum!</text>
      <text x="334" y="181" fill="#5b1a8a">Vruuum!</text>
      <text x="330" y="176" fill="#7b2cbf">Vruuum!</text>
      <text x="326" y="171" fill="#ff3d8b">Vruuum!</text>
      <text x="320" y="164" fill="url(#lgOuro)" stroke="#1a1446" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Vruuum!</text>
    </g>
    <g class="lg-brilhos" fill="#ffffff">
      <path class="b1" d="M175 52 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z"/><path class="b2" d="M520 40 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z"/>
      <path class="b3" d="M585 160 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    </g>
  </svg></h1>
  <p class="sub frase-intro"><span data-t="Pronto|Ready"></span> <span data-t="pra sentir|to feel"></span> <span data-t="a velocidade?|the speed?"></span></p>
  <button id="btEntrar" class="grande" type="button" data-t="🔑 Toque para ligar o motor!|🔑 Tap to start your engine!"></button>
  <p class="dica" data-t="Aumente o volume 🔊|Turn the volume up 🔊"></p>
</section>

<section id="menu" class="tela" data-recurso="vruuum">
  <div class="faixa">
    <button id="btLingua" class="mini" type="button" aria-label="Idioma / Language">EN</button>
    <button id="btSom" class="mini" type="button" aria-label="Som / Sound">🔊</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como jogar / How to play" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo pequeno">Vruuum!</h1>

  <div id="ajuda" class="ajuda" hidden>
    <p data-t="✈️ Avião, jato e helicóptero voam: a estrada fica lá embaixo e você segue o caminho de luzes no céu, desviando de pássaros, nuvens de tempestade e outros aviões. Os anéis dourados dão TURBO e as correntes de ar levam lá para cima, até as estrelas altas.|✈️ Plane, jet and helicopter fly: the road stays far below and you follow the path of lights in the sky, dodging birds, storm clouds and other planes. Golden rings give TURBO and updrafts lift you up to the high stars."></p>
    <p data-t="🌊 No rio o veículo vira barco (os bichos nadam): desvie das boias e dos redemoinhos e passe pelas setas azuis para ganhar TURBO. O mapinha redondo, no canto de cima, mostra a pista inteira e onde está cada um.|🌊 On the river your ride turns into a boat (animals swim): dodge the buoys and whirlpools and go through the blue arrows for TURBO. The little round map up in the corner shows the whole track and where everyone is."></p>
    <p data-t="🏆 Pontos: estrela 100, estrela no ar 200, turbo e rampa 50; cada portal de mundo é um CHECKPOINT (500 + bônus por rapidez). Bater tira pontos, mas ninguém perde.|🏆 Points: star 100, star in the air 200, turbo and ramp 50; every world gate is a CHECKPOINT (500 + speed bonus). Crashing takes points away, but nobody loses."></p>
    <p data-t="O carro acelera sozinho. Você vira para a esquerda e para a direita e aperta ⬆ PULAR para passar por cima dos cones, da lama e dos carrinhos. Pegue as ⭐ estrelas, passe pelo 🌈 arco-íris para ganhar TURBO e suba na rampa para um pulão até as estrelas do ar. Ninguém perde: bater só deixa o carro mais lento e derruba umas estrelas.|The car speeds up by itself. Steer left and right and press ⬆ JUMP to hop over cones, mud and cars. Grab the ⭐ stars, drive through the 🌈 rainbow for TURBO and hit the ramp for a big jump to the stars in the air. Nobody loses: crashing only slows you down and drops a few stars."></p>
    <p data-t="👆 Celular ou tablet (deitado ou em pé): segure o lado esquerdo ou direito da tela para virar; toque no botão ⬆ ou deslize o dedo para cima para pular. Com 2 jogadores, cada um no seu pedaço da tela.|👆 Phone or tablet (sideways or upright): hold the left or right side of the screen to steer; tap the ⬆ button or swipe up to jump. With 2 players, each one on their own half."></p>
    <p data-t="📱 Com 1 jogador, o celular também é volante: incline para um lado e o carro vira; dê um toquinho com o celular para cima e o carro pula. Celular retinho = carro reto.|📱 With 1 player, the phone is also a steering wheel: tilt it and the car turns; give the phone a little flick up and the car jumps. Phone level = car straight."></p>
    <p data-t="⌨️ Teclado: setas para virar e ⬆ (ou espaço) para pular; com 2 jogadores, jogador 1 usa A, D e W, jogador 2 as setas. H = buzina, para baixo = freio. 📺 Controle da TV: setas para virar, OK para pular. 🎮 Controle de videogame: A pula, X buzina.|⌨️ Keyboard: arrows to steer and ⬆ (or space) to jump; with 2 players, player 1 uses A, D and W, player 2 the arrows. H = horn, down = brake. 📺 TV remote: arrows to steer, OK to jump. 🎮 Game controller: A jumps, X honks."></p>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Quantos vão correr?|How many racers?"></p>
    <div class="opcoes" role="group">
      <button class="opcao" type="button" data-jogadores="1" data-t="👤 1 jogador|👤 1 player"></button>
      <button class="opcao" type="button" data-jogadores="2" data-t="👥 2 jogadores (tela dividida)|👥 2 players (split screen)"></button>
    </div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Nível|Level"></p>
    <div class="opcoes" role="group">
      <button class="opcao crianca" type="button" data-nivel="crianca" data-t="🐢 Criança|🐢 Kids"></button>
      <button class="opcao normal" type="button" data-nivel="normal" data-t="🚗 Normal|🚗 Normal"></button>
      <button class="opcao turbo" type="button" data-nivel="turbo" data-t="🚀 Turbo|🚀 Turbo"></button>
    </div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Visual|Look"></p>
    <div class="opcoes" role="group">
      <button class="opcao visual-misto" type="button" data-visual="misto" data-t="🔀 Misto|🔀 Mixed"></button>
      <button class="opcao visual-neon" type="button" data-visual="neon" data-t="🌃 Neon|🌃 Neon"></button>
      <button class="opcao" type="button" data-visual="colorido" data-t="🌈 Colorido|🌈 Colorful"></button>
    </div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Cenários da corrida (escolha até 4)|Race worlds (pick up to 4)"></p>
    <div id="mundosEsc" class="opcoes mundos" role="group" aria-label="Cenários / Worlds"></div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="🎵 Música|🎵 Music"></p>
    <div class="musica-esc">
      <button id="musAnt" class="mini" type="button" aria-label="Música anterior / Previous song">⏮</button>
      <button id="musNome" class="opcao mus-nome" type="button" aria-expanded="false" aria-controls="musLista"></button>
      <button id="musProx" class="mini" type="button" aria-label="Próxima música / Next song">⏭</button>
    </div>
    <div id="musLista" class="mus-lista" role="group" aria-label="Músicas / Songs" hidden></div>
    <p id="musOff" class="dica" hidden data-t="Sem internet: toca só a música guardada no aparelho.|Offline: only the song saved on the device plays."></p>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Rivais|Rivals"></p>
    <div class="opcoes" role="group">
      <button class="opcao" type="button" data-rivais="com" data-t="🏁 Com rivais|🏁 With rivals"></button>
      <button class="opcao" type="button" data-rivais="sem" data-t="Sem rivais|No rivals"></button>
    </div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Como dirigir|How to steer"></p>
    <div class="opcoes" role="group">
      <button class="opcao" type="button" data-controle="toque" data-t="👆 Tela e celular|👆 Screen and phone"></button>
      <button class="opcao" type="button" data-controle="maos" data-t="🙌 Mãos na câmera|🙌 Hands on camera"></button>
    </div>
    <p id="dicaMaos" class="dica" hidden data-t="Fique de frente para a câmera, com as duas mãos no ar como num volante. Mão direita para baixo vira para a direita, mão esquerda para baixo vira para a esquerda. As duas mãos para cima rápido: pula. As duas lá embaixo: freia. Na TV: ligue o celular, tablet ou notebook na TV (espelhar a tela ou cabo) com a câmera virada para quem joga. O vídeo não sai do aparelho.|Face the camera with both hands up like holding a wheel. Right hand down turns right, left hand down turns left. Both hands up fast: jump. Both hands low: brake. On a TV: connect the phone, tablet or laptop to the TV (screen mirroring or cable) with the camera facing the players. The video never leaves the device."></p>
  </div>

  <div id="garagem" class="garagem">
    <div class="vitrine">
      <div id="abas" class="abas" role="tablist" hidden>
        <button class="aba" type="button" role="tab" data-aba="0"></button>
        <button class="aba" type="button" role="tab" data-aba="1"></button>
        <button id="tirarJ2" class="aba tirar" type="button" data-t="✕ Só 1 jogador|✕ Just 1 player"></button>
      </div>
      <canvas id="previa" class="previa" width="560" height="340" aria-hidden="true"></canvas>
      <p id="nomeVeic" class="nome-veic" aria-live="polite"></p>
      <div class="fichas">
        <span data-t="Velocidade|Speed"></span><span class="barra"><i id="barraVel"></i></span>
        <span data-t="Curvas|Handling"></span><span class="barra"><i id="barraCurva"></i></span>
      </div>
      <p id="dicaTecla" class="tecla" hidden></p>
    </div>
    <div class="opcoes-garagem">
      <p class="rotulo titulo-garagem" data-t="Escolha o veículo|Pick your ride"></p>
      <div id="veiculos" class="veiculos"></div>
      <p class="rotulo" data-t="Cor|Color"></p>
      <div id="cores" class="cores" role="group" aria-label="Cor / Color"></div>
      <p class="rotulo" data-t="Corpo|Body"></p>
      <div class="opcoes corpo" role="group" aria-label="Corpo / Body">
        <button class="opcao" type="button" data-corpo="menina" data-t="👧 Menina|👧 Girl"></button>
        <button class="opcao" type="button" data-corpo="menino" data-t="👦 Menino|👦 Boy"></button>
      </div>
      <p class="rotulo" data-t="Piloto|Driver"></p>
      <div id="bichos" class="bichos" role="group" aria-label="Piloto / Driver"></div>
    </div>
  </div>

  <div class="barra-correr">
    <button id="btCorrer" class="grande" type="button" data-t="🏁 Correr!|🏁 Race!"></button>
  </div>
  <p class="recorde-menu"><span data-t="Recorde de pontos neste nível|Points record on this level"></span>: <b id="recordeMenu">0</b></p>
  <div id="guardar" class="guardar">
    <button id="btGuardar" class="medio" type="button" data-t="📲 Guardar no celular|📲 Save on the phone"></button>
    <p id="guardarAviso" class="dica" aria-live="polite" data-t="Para jogar sem internet, com ícone na tela. Sem login.|To play offline, with an icon on the home screen. No login."></p>
  </div>
  <p id="tocando" class="rodape" aria-live="polite"></p>
  <p class="rodape"><span id="ver"></span> · SolverONE · <a href="https://solverone.com.br/kids/" data-t="🍩 Mais brincadeiras|🍩 More games"></a></p>
</section>

<section id="jogo" class="tela">
  <canvas id="tela"></canvas>
  <div id="camMaos" class="cam-maos" hidden aria-hidden="true">
    <video id="videoMaos" playsinline muted></video>
    <canvas id="maosTela" width="240" height="180"></canvas>
    <p id="maosAviso"></p>
  </div>
  <div class="botoes-jogo">
    <button id="btPausa" class="mini" type="button" aria-label="Pausar / Pause">⏸</button>
    <button id="btSomJogo" class="mini" type="button" aria-label="Som / Sound">🔊</button>
    <button id="btGirar" class="mini" type="button" aria-label="Virar a tela (deitado ou em pé) / Rotate the screen" hidden>🔄</button>
  </div>
  <div id="pausa" class="pausa-painel" hidden>
    <h2 data-t="Pausa|Paused"></h2>
    <button id="btContinuar" class="grande" type="button" data-t="▶ Continuar|▶ Resume"></button>
    <button id="btRecomecar" class="medio" type="button" data-t="🔁 Começar de novo|🔁 Restart"></button>
    <button id="btSair" class="medio" type="button" data-t="🏠 Menu|🏠 Menu"></button>
  </div>
</section>

<section id="fim" class="tela">
  <h2 class="logo pequeno" data-t="🏁 Fim da corrida!|🏁 Race over!"></h2>
  <canvas id="podio" class="podio" width="720" height="420" aria-hidden="true"></canvas>
  <div id="resultado" class="resultado" aria-live="polite"></div>
  <p id="novoRecorde" class="recorde-novo" hidden data-t="🎉 Novo recorde de pontos!|🎉 New points record!"></p>
  <p class="recorde-menu"><span data-t="Recorde|Record"></span>: <b id="recordeFim">0</b> pts</p>
  <button id="btDeNovo" class="grande" type="button" data-t="🔁 Correr de novo|🔁 Race again"></button>
  <button id="btMenu" class="medio" type="button" data-t="🏠 Menu|🏠 Menu"></button>
</section>

<section id="desligado" class="tela">
  <p data-t="Esta brincadeira está desligada no momento.|This game is turned off right now."></p>
</section>

<div id="selfie" class="selfie" hidden role="dialog" aria-modal="true" aria-labelledby="selfieTitulo">
  <div class="selfie-painel">
    <h2 id="selfieTitulo" data-t="📸 Seu rosto no carrinho|📸 Your face in the car"></h2>
    <p class="dica" data-t="A foto fica só neste aparelho e não vai para a internet. Peça ajuda a um adulto.|The photo stays only on this device and never goes online. Ask a grown-up to help."></p>
    <div class="selfie-botoes">
      <label class="medio botao-arquivo"><span data-t="🤳 Tirar selfie|🤳 Take a selfie"></span><input id="selfieCamera" type="file" accept="image/*" capture="user"></label>
      <label class="medio botao-arquivo"><span data-t="🖼️ Escolher foto|🖼️ Pick a photo"></span><input id="selfieGaleria" type="file" accept="image/*"></label>
    </div>
    <div id="selfieEditor" class="selfie-editor" hidden>
      <canvas id="selfieTela" width="400" height="400" aria-label="Arraste o círculo até o rosto / Drag the circle onto the face"></canvas>
      <div class="selfie-ajuste">
        <p id="selfieAviso" class="dica" aria-live="polite"></p>
        <label class="rotulo selfie-tam"><span data-t="Tamanho do círculo|Circle size"></span><input id="selfieTam" type="range" min="8" max="80" value="35"></label>
        <button id="selfieUsar" class="grande" type="button" data-t="✅ Usar este rosto|✅ Use this face"></button>
      </div>
    </div>
    <div class="selfie-botoes">
      <button id="selfieApagar" class="medio" type="button" data-t="🗑️ Apagar minha foto|🗑️ Delete my photo"></button>
      <button id="selfieFechar" class="medio" type="button" data-t="Fechar|Close"></button>
    </div>
  </div>
</div>

<div id="aviso" class="sr" aria-live="polite"></div>
<div id="sondaBorda" aria-hidden="true"></div>
