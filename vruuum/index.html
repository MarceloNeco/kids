  arco-íris e rampas, passando por 4 mundos (praia, floresta, doces, neve, cidade neon).
  1 jogador ou 2 na mesma tela (dividida). Toque, teclado, controle de videogame, controle da TV
  ou o acelerômetro do celular. Sem login, sem banco, sem cookie: só arquivos estáticos (cache no aparelho
  pelo sw.js). Nenhum script inline: a CSP acima não permite. Mapa dos arquivos: LEIA-ME.md.
  Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->

  <div id="ajuda" class="ajuda" hidden>
    <p data-t="✈️ Avião, jato e helicóptero voam: a estrada fica lá embaixo e você segue o caminho de luzes no céu, desviando de pássaros, nuvens de tempestade e outros aviões. Os anéis dourados dão TURBO e as correntes de ar levam lá para cima, até as estrelas altas.|✈️ Plane, jet and helicopter fly: the road stays far below and you follow the path of lights in the sky, dodging birds, storm clouds and other planes. Golden rings give TURBO and updrafts lift you up to the high stars.|✈️ El avión, el jet y el helicóptero vuelan: la carretera queda allá abajo y tú sigues el camino de luces en el cielo, esquivando pájaros, nubes de tormenta y otros aviones. Los anillos dorados dan TURBO y las corrientes de aire te suben bien alto, hasta las estrellas más altas."></p>
    <p data-t="🌊 No rio o veículo vira barco (os bichos nadam): desvie das boias e dos redemoinhos e passe pelas setas azuis para ganhar TURBO. O mapinha redondo, no canto de cima, mostra a pista inteira e onde está cada um.|🌊 On the river your ride turns into a boat (animals swim): dodge the buoys and whirlpools and go through the blue arrows for TURBO. The little round map up in the corner shows the whole track and where everyone is.|🌊 En el río tu vehículo se convierte en barco (los animales nadan): esquiva las boyas y los remolinos y pasa por las flechas azules para ganar TURBO. El mapa redondo de la esquina de arriba enseña toda la pista y dónde va cada uno."></p>
    <p data-t="🏆 Pontos: estrela 100, estrela no ar 200, turbo e rampa 50; cada portal de mundo é um CHECKPOINT (500 + bônus por rapidez). Bater tira pontos, mas ninguém perde.|🏆 Points: star 100, star in the air 200, turbo and ramp 50; every world gate is a CHECKPOINT (500 + speed bonus). Crashing takes points away, but nobody loses.|🏆 Puntos: estrella 100, estrella en el aire 200, turbo y rampa 50; cada portal de mundo es un CHECKPOINT (500 + premio por llegar rápido). Chocar quita puntos, pero nadie pierde."></p>
    <p data-t="O carro acelera sozinho. Você vira para a esquerda e para a direita e aperta ⬆ PULAR para passar por cima dos cones, da lama e dos carrinhos. Pegue as ⭐ estrelas, passe pelo 🌈 arco-íris para ganhar TURBO e suba na rampa para um pulão até as estrelas do ar. Ninguém perde: bater só deixa o carro mais lento e derruba umas estrelas.|The car speeds up by itself. Steer left and right and press ⬆ JUMP to hop over cones, mud and cars. Grab the ⭐ stars, drive through the 🌈 rainbow for TURBO and hit the ramp for a big jump to the stars in the air. Nobody loses: crashing only slows you down and drops a few stars.|El coche acelera solo. Tú giras a la izquierda y a la derecha y pulsas ⬆ SALTAR para pasar por encima de los conos, el barro y los cochecitos. Coge las ⭐ estrellas, pasa por el 🌈 arcoíris para ganar TURBO y sube a la rampa para dar un saltote hasta las estrellas del aire. Nadie pierde: chocar solo hace que el coche vaya más lento y suelte unas estrellas."></p>
    <p data-t="👆 Celular ou tablet (deitado ou em pé): segure o lado esquerdo ou direito da tela para virar; toque no botão ⬆ ou deslize o dedo para cima para pular. Com 2 jogadores, cada um no seu pedaço da tela.|👆 Phone or tablet (sideways or upright): hold the left or right side of the screen to steer; tap the ⬆ button or swipe up to jump. With 2 players, each one on their own half.|👆 Móvil o tableta (en horizontal o en vertical): deja el dedo en el lado izquierdo o derecho de la pantalla para girar; toca el botón ⬆ o desliza el dedo hacia arriba para saltar. Con 2 jugadores, cada uno en su mitad de la pantalla."></p>
    <p data-t="📱 Com 1 jogador, o celular também é volante: incline para um lado e o carro vira; dê um toquinho com o celular para cima e o carro pula. Celular retinho = carro reto.|📱 With 1 player, the phone is also a steering wheel: tilt it and the car turns; give the phone a little flick up and the car jumps. Phone level = car straight.|📱 Con 1 jugador, el móvil también es un volante: inclínalo hacia un lado y el coche gira; dale un golpecito suave hacia arriba y el coche salta. Móvil recto = coche recto."></p>
    <p data-t="⌨️ Teclado: setas para virar e ⬆ (ou espaço) para pular; com 2 jogadores, jogador 1 usa A, D e W, jogador 2 as setas. H = buzina, para baixo = freio. 📺 Controle da TV: setas para virar, OK para pular. 🎮 Controle de videogame: A pula, X buzina.|⌨️ Keyboard: arrows to steer and ⬆ (or space) to jump; with 2 players, player 1 uses A, D and W, player 2 the arrows. H = horn, down = brake. 📺 TV remote: arrows to steer, OK to jump. 🎮 Game controller: A jumps, X honks.|⌨️ Teclado: flechas para girar y ⬆ (o espacio) para saltar; con 2 jugadores, el jugador 1 usa A, D y W, y el jugador 2 las flechas. H = bocina, abajo = freno. 📺 Mando de la tele: flechas para girar, OK para saltar. 🎮 Mando de consola: A salta, X toca la bocina."></p>

    <p id="dicaMaos" class="dica" hidden data-t="Fique de frente para a câmera, com as duas mãos no ar como num volante. Mão direita para baixo vira para a direita, mão esquerda para baixo vira para a esquerda. As duas mãos para cima rápido: pula. As duas lá embaixo: freia. Na TV: ligue o celular, tablet ou notebook na TV (espelhar a tela ou cabo) com a câmera virada para quem joga. O vídeo não sai do aparelho.|Face the camera with both hands up like holding a wheel. Right hand down turns right, left hand down turns left. Both hands up fast: jump. Both hands low: brake. On a TV: connect the phone, tablet or laptop to the TV (screen mirroring or cable) with the camera facing the players. The video never leaves the device.|Ponte frente a la cámara, con las dos manos en el aire como si sujetaras un volante. Mano derecha abajo: giras a la derecha; mano izquierda abajo: giras a la izquierda. Las dos manos arriba, rápido: saltas. Las dos bien abajo: frenas. En la tele: conecta el móvil, la tableta o el portátil a la tele (duplicar pantalla o cable) con la cámara mirando a quien juega. El vídeo no sale del aparato."></p>
